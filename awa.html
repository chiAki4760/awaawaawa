<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>あわあわ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one full-screen water tank; a quiet glass HUD floats at the top. Single deliberate deep-water look. */
:root{
  --deep:#06233a; --mid:#0b4a6b; --shallow:#1b7f95; --glow:#bff3f0;
  --ink:#e8fbfa; --soft:rgba(232,251,250,.62); --glass:rgba(255,255,255,.08);
  --pearl:#ffe6a8;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--ink);font-family:var(--round);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#tank{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.count{display:flex;flex-direction:column;gap:2px}
.count .num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(191,243,240,.35)}
.count .lbl{font-size:12px;letter-spacing:.12em;color:var(--soft)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.depth{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
.depth b{color:var(--ink);font-weight:700;font-size:15px}
.meter{width:96px;height:4px;border-radius:2px;background:var(--glass);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--glow);transition:width .4s ease}
.btns{display:flex;gap:8px;pointer-events:auto}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px)}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .9s ease;font-size:15px;color:var(--soft);line-height:1.7;width:min(90vw,340px)}
.toast b{display:block;font-size:26px;color:var(--ink);font-weight:700}
.toast.show{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;
  font-size:13px;color:var(--soft);pointer-events:none;transition:opacity 1.2s}
</style>
</head>
<body>

<canvas id="tank" aria-label="泡の水槽。泡をタップすると消えます"></canvas>

<div class="hud">
  <div class="count"><span class="num" id="score">0</span><span class="lbl">はじけた泡</span></div>
  <div class="side">
    <div class="depth">水深 <b id="depth">2</b> m<br><span id="best">きろく 0</span></div>
    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
    <div class="btns">
      <button class="btn" id="sound" type="button">音 オフ</button>
      <button class="btn" id="pause" type="button">ひと休み</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="hint" id="hint">泡にふれると、ぱっと消えます</div>

<script>
(function(){
const cv=document.getElementById('tank'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();

/* ---- levels: every 25 pops we sink deeper ---- */
const PER=25;
let score=0,best=0,paused=false,soundOn=false,actx=null;
try{best=+localStorage.getItem('awa-best')||0}catch(e){}
$('best').textContent='きろく '+best;
function level(){return Math.floor(score/PER)}
function cfg(){
  const L=level();
  return{
    speed:28+L*9,                     // px/s
    rMin:Math.max(14,30-L*1.6),rMax:Math.max(26,58-L*3),
    spawn:Math.max(.22,1.0-L*.085),   // seconds between bubbles
    wobble:10+L*3,
    max:12+L*3,
    pearl:L>=2?.06:0                   // chance of a golden pearl bubble
  };
}
const depthNames=['浅瀬','さんご礁','青の層','光のとどく底','静かな深み','月の届かない海','まっくらな海溝'];

/* ---- bubbles ---- */
let bubbles=[],bits=[],motes=[],t0=performance.now(),spawnT=0;
function spawn(){
  const c=cfg();
  if(bubbles.length>=c.max)return;
  const r=c.rMin+Math.random()*(c.rMax-c.rMin);
  bubbles.push({x:r+Math.random()*(W-2*r),y:H+r+10,r,
    sp:c.speed*(.7+Math.random()*.6)*(40/r)**.35,
    ph:Math.random()*6.28,wf:.6+Math.random()*.9,wa:c.wobble*(.5+Math.random()),
    hue:185+Math.random()*30,pearl:Math.random()<c.pearl,born:0});
}
for(let i=0;i<40;i++)motes.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.4,v:.004+Math.random()*.01});
// a few bubbles already on screen so the first frame isn't empty
for(let i=0;i<7;i++){spawn();const b=bubbles[bubbles.length-1];b.y=H*(.3+Math.random()*.7);b.born=1}

/* ---- sound: soft "pop" via Web Audio ---- */
function pop(pearl){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';const f=pearl?880:420+Math.random()*260;
  o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*2.2,n+.07);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(pearl?.18:.12,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+(pearl?.5:.16));
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.6);
}
$('sound').onclick=e=>{
  e.stopPropagation();soundOn=!soundOn;
  if(soundOn&&!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  if(actx&&actx.state==='suspended')actx.resume();
  $('sound').textContent=soundOn?'音 オン':'音 オフ';
};
$('pause').onclick=e=>{
  e.stopPropagation();paused=!paused;$('pause').textContent=paused?'つづける':'ひと休み';
  if(!paused)t0=performance.now();
  showToast(paused?'<b>ひと休み</b>ゆっくり深呼吸':'',paused?99999:0);
};

/* ---- tapping ---- */
let lastLevel=0,hintGone=false;
function hit(px,py){
  if(paused)return;
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i],dx=px-b.x,dy=py-b.y;
    if(dx*dx+dy*dy<=(b.r+10)**2){
      burst(b);bubbles.splice(i,1);pop(b.pearl);
      score+=b.pearl?5:1;update();
      if(!hintGone){hintGone=true;$('hint').style.opacity=0}
      return;
    }
  }
}
cv.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));

function burst(b){
  const n=b.pearl?22:12;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;
    bits.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*(b.r/9),life:1,pearl:b.pearl})}
  bits.push({ring:1,x:b.x,y:b.y,r:b.r,life:1,pearl:b.pearl});
}

function update(){
  $('score').textContent=score;
  const L=level();
  $('depth').textContent=2+L*8;
  $('bar').style.width=((score%PER)/PER*100)+'%';
  if(score>best){best=score;try{localStorage.setItem('awa-best',best)}catch(e){}}
  $('best').textContent='きろく '+best;
  if(L>lastLevel){lastLevel=L;
    showToast('<b>水深 '+(2+L*8)+' m</b>'+(depthNames[Math.min(L,depthNames.length-1)])+'へ。泡が少し速くなります',2600)}
}
let toastTimer;
function showToast(html,ms){
  const el=$('toast');clearTimeout(toastTimer);
  if(!html){el.classList.remove('show');return}
  el.innerHTML=html;el.classList.add('show');
  toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

/* ---- drawing ---- */
function water(){
  const L=Math.min(level(),8),k=L/8;
  // deeper = darker
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${192-k*12} ${62-k*20}% ${34-k*22}%)`);
  g.addColorStop(.55,`hsl(${200-k*10} ${70-k*25}% ${18-k*11}%)`);
  g.addColorStop(1,`hsl(${210} ${70-k*30}% ${8-k*4}%)`);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // light rays from the surface
  const t=performance.now()/1000;
  cx.save();cx.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){
    const x=W*(.15+i*.25)+Math.sin(t*.2+i*1.7)*W*.06;
    const rg=cx.createLinearGradient(0,0,0,H*.85);
    rg.addColorStop(0,`rgba(190,240,240,${.07*(1-k*.8)})`);rg.addColorStop(1,'rgba(190,240,240,0)');
    cx.fillStyle=rg;cx.beginPath();cx.moveTo(x-30,0);cx.lineTo(x+40,0);cx.lineTo(x+140,H*.85);cx.lineTo(x-90,H*.85);cx.fill();
  }
  cx.restore();
  // drifting specks
  cx.fillStyle='rgba(220,250,250,.25)';
  for(const m of motes){cx.beginPath();cx.arc(m.x*W,m.y*H,m.s,0,6.28);cx.fill()}
}
function drawBubble(b){
  const s=Math.min(1,b.born);const r=b.r*(.6+.4*s);
  cx.save();cx.globalAlpha=s;
  const g=cx.createRadialGradient(b.x-r*.3,b.y-r*.35,r*.1,b.x,b.y,r);
  if(b.pearl){
    g.addColorStop(0,'rgba(255,248,220,.85)');g.addColorStop(.6,'rgba(255,214,140,.28)');g.addColorStop(1,'rgba(255,230,168,.55)');
  }else{
    g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.75,`hsla(${b.hue},80%,80%,.08)`);g.addColorStop(1,`hsla(${b.hue},90%,88%,.42)`);
  }
  cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,r,0,6.28);cx.fill();
  cx.lineWidth=1.2;cx.strokeStyle=b.pearl?'rgba(255,230,168,.8)':`hsla(${b.hue},90%,92%,.55)`;cx.stroke();
  // highlights
  cx.fillStyle='rgba(255,255,255,.75)';
  cx.beginPath();cx.ellipse(b.x-r*.38,b.y-r*.42,r*.2,r*.11,-.7,0,6.28);cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';
  cx.beginPath();cx.arc(b.x+r*.42,b.y+r*.38,r*.06,0,6.28);cx.fill();
  cx.restore();
}

function frame(now){
  let dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(paused)dt=0;
  if(reduce)dt*=.6;
  const c=cfg();
  spawnT-=dt;if(spawnT<=0&&!paused){spawn();spawnT=c.spawn*(.6+Math.random()*.8)}
  for(const m of motes){m.y-=m.v*dt;if(m.y<0)m.y=1}
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.born=Math.min(1,b.born+dt*2.5);
    b.y-=b.sp*dt;b.ph+=b.wf*dt;b.x+=Math.cos(b.ph)*b.wa*dt;
    if(b.y<-b.r-10)bubbles.splice(i,1);   // escaped quietly; no penalty
  }
  for(let i=bits.length-1;i>=0;i--){
    const p=bits[i];p.life-=dt*(p.ring?3:1.8);
    if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy=p.vy*.94-30*dt}
    if(p.life<=0)bits.splice(i,1);
  }
  water();
  for(const b of bubbles)drawBubble(b);
  for(const p of bits){
    cx.globalAlpha=Math.max(0,p.life);
    if(p.ring){cx.strokeStyle=p.pearl?'#ffe6a8':'#dffcfa';cx.lineWidth=2*p.life;
      cx.beginPath();cx.arc(p.x,p.y,p.r*(1+(1-p.life)*.8),0,6.28);cx.stroke()}
    else{cx.fillStyle=p.pearl?'#ffe6a8':'#e8fbfa';cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}
  }
  cx.globalAlpha=1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
