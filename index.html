  const story=L.i>=0;
  if(story){letters=L.i+1;lDone=letters===LETTERS.length;try{localStorage.setItem('awa-letters',letters)}catch(e){}}
  $('lHead').textContent=story?'びんの中の手紙　'+(L.i+1)+' / '+LETTERS.length:'びんの中の手紙　おまけ';
  $('lBody').textContent=L.t;$('lSign').textContent=story?'ナギ':'ナギより';
  lWasPaused=paused;paused=true;
  $('letterc').classList.add('show');shimmer();noise(.35,'bandpass',3200,.06);
  bottleCd=story?80+Math.random()*70:150+Math.random()*120;
}
$('lClose').onclick=e=>{e.stopPropagation();$('letterc').classList.remove('show');paused=lWasPaused;if(!paused)t0=performance.now();
  if(lDone){lDone=false;showToast('<b>手紙がそろいました</b>ナギからの手紙 '+LETTERS.length+' 通。これからも、ときどきびんが流れてきます',3600)}};
function drawBottle(t){
  const b=bottle;if(!b)return;
  const S=b.S,w=S*.62,h=S*1.35,nw=S*.22,fade=b.opened?Math.max(0,1-b.open/1.3):1;
  cx.save();cx.globalAlpha=fade;cx.translate(b.x,b.y);
  // soft warm halo so it stands out in the dark
  const pulse=.6+.4*Math.sin(t*2.4);
  const hg=cx.createRadialGradient(0,0,0,0,0,S*1.5);hg.addColorStop(0,`rgba(255,236,190,${.28*pulse})`);hg.addColorStop(1,'rgba(255,236,190,0)');
  cx.fillStyle=hg;cx.beginPath();cx.arc(0,0,S*1.5,0,TAU);cx.fill();
  cx.rotate(Math.sin(b.age*1.3+b.ph)*.4+.25);
  const top=-h*.5,sh=-h*.18,bot=h*.5,nk=top+h*.22;
  // the glass
  cx.beginPath();
  cx.moveTo(-nw/2,top);cx.lineTo(-nw/2,nk);
  cx.bezierCurveTo(-nw/2,sh-h*.02,-w/2,sh-h*.06,-w/2,sh+h*.04);
  cx.lineTo(-w/2,bot-w*.25);cx.quadraticCurveTo(-w/2,bot,-w/2+w*.25,bot);
  cx.lineTo(w/2-w*.25,bot);cx.quadraticCurveTo(w/2,bot,w/2,bot-w*.25);
  cx.lineTo(w/2,sh+h*.04);cx.bezierCurveTo(w/2,sh-h*.06,nw/2,sh-h*.02,nw/2,nk);
  cx.lineTo(nw/2,top);cx.closePath();
  const gg=cx.createLinearGradient(-w/2,0,w/2,0);
  gg.addColorStop(0,b.L.c+'66');gg.addColorStop(.5,b.L.c+'30');gg.addColorStop(1,b.L.c+'80');
  cx.fillStyle=gg;cx.fill();
  cx.lineWidth=Math.max(1.4,S*.035);cx.strokeStyle=b.L.c+'dd';cx.stroke();
  // the rolled letter inside, tied with a red string
  cx.save();cx.rotate(-.12);
  cx.fillStyle='#f3e6c8';const pw=w*.42,ph=h*.52,py=sh+h*.1;
  cx.fillRect(-pw/2,py,pw,ph);
  cx.fillStyle='rgba(150,120,80,.35)';cx.fillRect(pw/2-pw*.22,py,pw*.22,ph);
  cx.strokeStyle='#d0484e';cx.lineWidth=Math.max(1.2,S*.03);cx.beginPath();cx.moveTo(-pw/2,py+ph*.5);cx.lineTo(pw/2,py+ph*.5);cx.stroke();
  cx.restore();
  // shine on the glass
  cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=Math.max(1.5,S*.05);cx.lineCap='round';
  cx.beginPath();cx.moveTo(-w*.3,sh+h*.1);cx.lineTo(-w*.3,bot-h*.12);cx.stroke();
  // the cork (flies off when opened)
  const cy=b.opened?-b.open*S*2.4:0,cr=b.opened?b.open*5:0;
  cx.save();cx.translate(0,top+cy);cx.rotate(cr);
  cx.fillStyle='#b98a58';cx.fillRect(-nw*.62,-h*.12,nw*1.24,h*.15);
  cx.fillStyle='rgba(90,60,30,.35)';cx.fillRect(-nw*.62,-h*.12,nw*1.24,h*.035);
  cx.restore();
  cx.restore();
  // a little twinkle on the shoulder
  if(!b.opened){const k=Math.max(0,Math.sin(t*3.1+b.ph));
    if(k>.2){const sx=b.x-S*.2,sy=b.y-S*.25,r=S*.22*k;
      cx.save();cx.globalAlpha=k*.9;cx.fillStyle='#fffbe8';cx.beginPath();
      cx.moveTo(sx,sy-r);cx.quadraticCurveTo(sx,sy,sx+r,sy);cx.quadraticCurveTo(sx,sy,sx,sy+r);
      cx.quadraticCurveTo(sx,sy,sx-r,sy);cx.quadraticCurveTo(sx,sy,sx,sy-r);cx.fill();cx.restore()}}
}

/* ---- tapping ---- */
let lastLevel=0,hintGone=false;
function hit(px,py){
  if(paused)return;
  if(evt&&evt.kind==='sub'){hitSub(px,py);return}
  if(hitBottle(px,py))return;
  if(evt&&evt.kind==='glow')plankRing(px,py);
  if(hitCreature(px,py))return;
  if(hitTube(px,py))return;
  if(hitShrimp(px,py))return;
  if(hitSquid(px,py))return;
  if(hitLoot(px,py))return;
  if(hitChest(px,py))return;
  if(hitLily(px,py))return;
  if(hitBlob(px,py))return;
  if(hitHoya(px,py))return;
  if(hitBone(px,py))return;
  if(evt&&EV[evt.kind]&&EV[evt.kind].hit(px,py))return;
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i],dx=px-b.x,dy=py-b.y;
    if(dx*dx+dy*dy<=(b.r+10)**2){
      burst(b);bubbles.splice(i,1);pop(b.pearl||b.glow);
      score+=b.pearl?5:b.glow?2:1;
      if(evt&&(evt.kind==='whale'||evt.kind==='deme'||(evt.kind==='glow'&&b.glow))){evt.n++;$('evn').textContent=evt.n}
      update();
      if(!hintGone){hintGone=true;$('hint').style.opacity=0}
      return;
    }
  }
  if(hitChimney(px,py))return;
  if(hitWhale(px,py))return;
  if(hitDeme(px,py))return;
}
cv.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));
/* keep quick double taps from zooming or lifting the page (iPhone Safari) */
cv.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
cv.addEventListener('touchmove',e=>{if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTouchEnd<350&&e.cancelable&&!e.target.closest('button'))e.preventDefault();lastTouchEnd=now},{passive:false});

function burst(b){
  const n=b.pearl||b.glow?22:12,col=b.glow?`hsl(${b.hue},100%,78%)`:null;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;
    bits.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*(b.r/9),life:1,pearl:b.pearl,col})}
  bits.push({ring:1,x:b.x,y:b.y,r:b.r,life:1,pearl:b.pearl,col});
}

function showSeas(){
  const n=seaN(),lap=Math.floor(returns/5)+1;
  document.querySelectorAll('#seas i').forEach((d,i)=>d.className=i<n?'done':i===n?'now':'');
  $('seaName').textContent=(lap>1?lap+'周目・':'')+SEANAMES[n];
  $('seas').setAttribute('aria-label','いまの海 '+(n+1)+' / 5 '+SEANAMES[n]);
}
function update(){
  showSeas();
  $('score').textContent=score;
  const L=level();
  $('depth').textContent=2+L*8;
  $('bar').style.width=((score%PER)/PER*100)+'%';
  if(score>best){best=score;try{localStorage.setItem('awa-best',best)}catch(e){}}
  $('best').textContent='きろく '+best;
  let leveled=false;
  if(L>lastLevel){lastLevel=L;leveled=true;
    if(!evt)showToast('<b>水深 '+(2+L*8)+' m</b>'+(depthNames[Math.min(L,depthNames.length-1)])+'へ。泡が少し速くなります',2600)}
  if(!evt&&!pendingEvt&&score>=nextAt){pendingEvt={kind:seqI>=SEQ.length?'sub':SEQ[seqI],wait:leveled?2.6:.4};seqI++}
  const nxName=seqI>=SEQ.length?'深海探査機':NAMES[SEQ[seqI]];
  $('nx').textContent=evt||pendingEvt?'できごとの最中':nxName+'まで あと '+Math.max(0,nextAt-score);
}
let toastTimer;
function showToast(html,ms){
  const el=$('toast');clearTimeout(toastTimer);
  if(!html){el.classList.remove('show');return}
  el.innerHTML=html;el.classList.add('show');
  toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

/* ---- drawing ---- */
function water(){
  const L=Math.min(level(),8),k=depthK!=null?depthK:L/8;
  // deeper = darker
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${192-k*12} ${62-k*20}% ${34-k*22}%)`);
  g.addColorStop(.55,`hsl(${200-k*10} ${70-k*25}% ${18-k*11}%)`);
  g.addColorStop(1,`hsl(${210} ${70-k*30}% ${8-k*4}%)`);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // light rays from the surface
  const t=performance.now()/1000;
  cx.save();cx.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){
    const x=W*(.15+i*.25)+Math.sin(t*.2+i*1.7)*W*.06;
    const rg=cx.createLinearGradient(0,0,0,H*.85);
    rg.addColorStop(0,`rgba(190,240,240,${.07*(1-k*.8)})`);rg.addColorStop(1,'rgba(190,240,240,0)');
    cx.fillStyle=rg;cx.beginPath();cx.moveTo(x-30,0);cx.lineTo(x+40,0);cx.lineTo(x+140,H*.85);cx.lineTo(x-90,H*.85);cx.fill();
  }
  cx.restore();
  // drifting specks
  cx.fillStyle='rgba(220,250,250,.25)';
  for(const m of motes){cx.beginPath();cx.arc(m.x*W,m.y*H,m.s,0,6.28);cx.fill()}
}
function drawBubble(b){
  const s=Math.min(1,b.born);const r=b.r*(.6+.4*s);
  cx.save();cx.globalAlpha=s;
  const g=cx.createRadialGradient(b.x-r*.3,b.y-r*.35,r*.1,b.x,b.y,r);
  if(b.pearl){
    g.addColorStop(0,'rgba(255,248,220,.85)');g.addColorStop(.6,'rgba(255,214,140,.28)');g.addColorStop(1,'rgba(255,230,168,.55)');
  }else if(b.glow){
    g.addColorStop(0,`hsla(${b.hue},100%,90%,.35)`);g.addColorStop(.7,`hsla(${b.hue},100%,70%,.15)`);g.addColorStop(1,`hsla(${b.hue},100%,75%,.7)`);
    cx.shadowColor=`hsl(${b.hue},100%,70%)`;cx.shadowBlur=18;
  }else{
    g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.75,`hsla(${b.hue},80%,80%,.08)`);g.addColorStop(1,`hsla(${b.hue},90%,88%,.42)`);
  }
  cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,r,0,6.28);cx.fill();
  cx.lineWidth=b.glow?1.8:1.2;cx.strokeStyle=b.pearl?'rgba(255,230,168,.8)':b.glow?`hsla(${b.hue},100%,82%,.95)`:`hsla(${b.hue},90%,92%,.55)`;cx.stroke();
  cx.shadowBlur=0;
  // highlights
  cx.fillStyle='rgba(255,255,255,.75)';
  cx.beginPath();cx.ellipse(b.x-r*.38,b.y-r*.42,r*.2,r*.11,-.7,0,6.28);cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';
  cx.beginPath();cx.arc(b.x+r*.42,b.y+r*.38,r*.06,0,6.28);cx.fill();
  cx.restore();
}

function frame(now){
  let dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(paused)dt=0;
  if(reduce)dt*=.6;
  const c=cfg(),t=now/1000;
  stepEvent(dt);
  spawnT-=dt;
  if(spawnT<=0&&!paused&&(!evt||evt.kind==='glow'||evt.kind==='squid'||evt.kind==='deme'||evt.kind==='lily'||evt.kind==='blob'||evt.kind==='hoya'||evt.kind==='bone'||(EV[evt.kind]&&EV[evt.kind].bubbles))){spawn();spawnT=c.spawn*(!evt?1:evt.kind==='glow'?.45:1.4)*(.6+Math.random()*.8)}
  for(const m of motes){m.y-=m.v*dt;if(m.y<0)m.y+=1}
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.born=Math.min(1,b.born+dt*2.5);
    b.y-=b.sp*dt;b.ph+=b.wf*dt;b.x+=Math.cos(b.ph)*b.wa*dt;
    if(b.y<-b.r-10)bubbles.splice(i,1);   // escaped quietly; no penalty
  }
  for(let i=bits.length-1;i>=0;i--){
    const p=bits[i];p.life-=dt*(p.ring?3:1.8);
    if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy=p.vy*.94-30*dt}
    if(p.life<=0)bits.splice(i,1);
  }
  stepShrimps(dt);stepSwimmers(dt);stepPlume(dt);stepPlank(dt);stepInk(dt);stepLoot(dt);stepSlime(dt);
  water();
  drawVent(t);drawPlume();
  drawSquidBody(t);
  drawWhale(t);drawDeme(t);
  stepCreature(dt);drawCreature(t);
  drawGlow();
  drawTreasure(t);drawLily(t);drawBlob(t);drawHoya(t);drawBone(t);if(evt&&EV[evt.kind])EV[evt.kind].draw(t);drawTents(t);
  drawParade(t);drawSurface(t);drawSub(t);stepBottle(dt);drawBottle(t);
  for(const b of bubbles)drawBubble(b);
  drawSlime();
  for(const s of shrimps)drawShrimp(s);
  drawLoot();drawInk();
  for(const p of bits){
    cx.globalAlpha=Math.max(0,Math.min(1,p.life));
    const col=p.col||(p.pearl?'#ffe6a8':p.ring?'#dffcfa':'#e8fbfa');
    if(p.ring){cx.strokeStyle=col;cx.lineWidth=2*p.life;
      cx.beginPath();cx.arc(p.x,p.y,p.r*(1+(1-p.life)*.8),0,6.28);cx.stroke()}
    else{cx.fillStyle=col;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}
  }
  cx.globalAlpha=1;
  drawPops(dt);
  requestAnimationFrame(frame);
}
update();
if(seaN()>0)setTimeout(()=>{if(!evt&&!paused)showToast('<b>'+SEANAMES[seaN()]+'</b>'+(seaN()+1)+' つめの海。深くもぐると、ここだけの生き物たちに会えます',3200)},1200);
requestAnimationFrame(frame);
})();
</script>
