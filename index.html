<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>あわあわ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one full-screen water tank; a quiet glass HUD floats at the top. Single deliberate deep-water look. */
:root{
  --deep:#06233a; --mid:#0b4a6b; --shallow:#1b7f95; --glow:#bff3f0;
  --ink:#e8fbfa; --soft:rgba(232,251,250,.62); --glass:rgba(255,255,255,.08);
  --pearl:#ffe6a8; --warm:#ffb27a;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
body{background:var(--deep);color:var(--ink);font-family:var(--round);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#tank{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
.btn{touch-action:manipulation}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.count{display:flex;flex-direction:column;gap:2px}
.count .num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(191,243,240,.35)}
.count .lbl{font-size:12px;letter-spacing:.12em;color:var(--soft)}
.count .nx{font-size:12px;color:var(--soft);margin-top:4px;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.depth{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
.depth b{color:var(--ink);font-weight:700;font-size:15px}
.seas{display:flex;align-items:center;justify-content:flex-end;gap:7px;font-size:11px;color:var(--soft);letter-spacing:.04em}
.seas .dots{display:flex;gap:6px}
.seas i{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(232,251,250,.55);box-sizing:border-box;display:block}
.seas i.done{background:rgba(232,251,250,.7);border-color:transparent}
.seas i.now{width:10px;height:10px;margin:-1px 0;background:#fff;border-color:transparent;box-shadow:0 0 8px var(--glow);animation:seaPulse 2.4s ease-in-out infinite}
@keyframes seaPulse{50%{box-shadow:0 0 2px var(--glow);opacity:.75}}
@media (prefers-reduced-motion:reduce){.seas i.now{animation:none}}
.meter{width:96px;height:4px;border-radius:2px;background:var(--glass);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--glow);transition:width .4s ease}
.btns{display:flex;gap:8px;pointer-events:auto}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px)}
.btns .btn{white-space:nowrap;padding:6px 10px;font-size:12px}
.count{min-width:0}
.side{flex-shrink:0}
.btns{gap:6px}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .9s ease;font-size:15px;color:var(--soft);line-height:1.7;width:min(90vw,340px)}
.toast b{display:block;font-size:26px;color:var(--ink);font-weight:700}
.toast.show{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;
  font-size:13px;color:var(--soft);pointer-events:none;transition:opacity 1.2s}
.ev{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none;
  font-size:14px;color:var(--ink);background:rgba(4,20,34,.6);border:1px solid rgba(191,243,240,.3);
  border-radius:999px;padding:7px 16px;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.ev[hidden]{display:none}
.ev b{color:var(--glow);font-size:17px}
.ev .tag{font-size:12px;letter-spacing:.08em;color:var(--deep);background:var(--glow);border-radius:999px;padding:2px 9px;margin-right:4px}
.ev.hot{border-color:rgba(255,178,122,.45)} .ev.hot b{color:var(--warm)} .ev.hot .tag{background:var(--warm)}
.endc{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);width:min(86vw,320px);box-sizing:border-box;padding:24px 20px 20px;
  border-radius:22px;background:rgba(6,35,58,.74);border:1px solid rgba(191,243,240,.32);backdrop-filter:blur(8px);
  text-align:center;opacity:0;pointer-events:none;transition:opacity 1.1s ease}
.endc.show{opacity:1;pointer-events:auto}
.endc .t{display:block;font-size:28px;font-weight:700;color:var(--ink)}
.endc .s{margin:6px 0 16px;font-size:14px;line-height:1.7;color:var(--soft)}
.endc dl{display:grid;grid-template-columns:auto auto;gap:6px 14px;margin:0 auto 18px;width:max-content;text-align:left;font-size:14px}
.endc dt{color:var(--soft)} .endc dd{margin:0;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.rbtns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.rbtns[hidden]{display:none}
.rbtns .btn{font-size:15px;padding:10px 16px}
#rAll,#rYes{border-color:rgba(255,150,140,.5);color:#ffd2cc}
.endc.paper{background:#f4ead2;border:1px solid #d8c49c;color:#4a3826;text-align:left;transform:translate(-50%,-50%) rotate(-1.2deg);
  box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:none;padding:22px 22px 18px}
.paper .lh{display:block;font-size:12px;letter-spacing:.12em;color:#9a7d55;margin-bottom:8px}
.paper .lb{margin:0 0 14px;font-size:15px;line-height:2;color:#4a3826;white-space:pre-line}
.paper .ls{display:block;text-align:right;font-size:14px;color:#7a5a3a;margin-bottom:12px}
.paper .btn{display:block;margin:0 auto;color:#5a4128;background:rgba(120,90,50,.1);border-color:rgba(120,90,50,.35)}
.endc .go{font-size:16px;padding:10px 22px;background:rgba(191,243,240,.16);border-color:rgba(191,243,240,.45)}
</style>
</head>
<body>

<canvas id="tank" aria-label="泡の水槽。泡をタップすると消えます"></canvas>

<div class="hud">
  <div class="count"><span class="num" id="score">0</span><span class="lbl">はじけた泡</span><span class="nx" id="nx">つぎのできごとまで 50</span></div>
  <div class="side">
    <div class="seas" id="seas" aria-label="いまの海"><span id="seaName"></span><span class="dots"><i></i><i></i><i></i><i></i><i></i></span></div>
    <div class="depth">水深 <b id="depth">2</b> m<br><span id="best">きろく 0</span><br><span id="zukan">であった生き物 0 / 13</span></div>
    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
    <div class="btns">
      <button class="btn" id="sound" type="button">音 オフ</button>
      <button class="btn" id="pause" type="button">ひと休み</button>
      <button class="btn" id="resetBtn" type="button">リセット</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ev" id="ev" hidden><span class="tag" id="evName">熱水の丘</span>のこり <b id="evt">0</b> 秒・<span id="evLbl">エビ</span> <b id="evn">0</b> <span id="evU">ぴき</span></div>
<div class="hint" id="hint">泡にふれると、ぱっと消えます</div>
<div class="endc" id="endc" role="dialog" aria-label="おかえりなさい">
  <b class="t">おかえりなさい</b>
  <p class="s">深海探査機に乗って、<br>海の上まで帰ってきました</p>
  <dl><dt>この旅ではじいた泡</dt><dd id="eScore">0</dd><dt>であった生き物</dt><dd id="eMet">0</dd><dt>海から帰ったのは</dt><dd id="eRet">1 回目</dd><dt>とどいた手紙</dt><dd id="eLet">0</dd></dl>
  <p class="s" id="eNext" style="margin-top:-6px"></p>
  <button class="btn go" id="again" type="button">もう一度もぐる</button>
</div>
<div class="endc paper" id="letterc" role="dialog" aria-label="ボトルメール">
  <span class="lh" id="lHead">びんの中の手紙</span>
  <p class="lb" id="lBody"></p>
  <span class="ls" id="lSign">ナギ</span>
  <button class="btn" id="lClose" type="button">たたんで、しまう</button>
</div>
<div class="endc" id="resetc" role="dialog" aria-label="きろくのリセット">
  <b class="t" style="font-size:22px">きろくのリセット</b>
  <p class="s" id="rMsg">どれを消しますか？</p>
  <div class="rbtns" id="rChoose">
    <button class="btn" id="rBest" type="button">最高記録だけ消す</button>
    <button class="btn" id="rAll" type="button">ぜんぶ消す</button>
    <button class="btn" id="rNo" type="button">やめる</button>
  </div>
  <div class="rbtns" id="rConfirm" hidden>
    <button class="btn" id="rYes" type="button">本当に消す</button>
    <button class="btn" id="rBack" type="button">やめる</button>
  </div>
</div>

<script>
(function(){
const cv=document.getElementById('tank'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;
function size(){DPR=Math.min(devicePixelRatio||1,2);const de=document.documentElement;W=de.clientWidth||innerWidth;H=de.clientHeight||innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,300));
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(visualViewport.scale>1.01)window.scrollTo(0,0);size()});size();
const TAU=Math.PI*2;

/* ---- levels: every 25 pops we sink deeper ---- */
const PER=25;
let score=0,best=0,paused=false,soundOn=false,actx=null;
try{best=+localStorage.getItem('awa-best')||0}catch(e){}
$('best').textContent='きろく '+best;
function level(){return Math.floor(score/PER)}
function cfg(){
  const L=level();
  return{
    speed:28+L*9,                     // px/s
    rMin:Math.max(14,30-L*1.6),rMax:Math.max(26,58-L*3),
    spawn:Math.max(.22,1.0-L*.085),   // seconds between bubbles
    wobble:10+L*3,
    max:12+L*3,
    pearl:L>=2?.06:0                   // chance of a golden pearl bubble
  };
}
const depthNames=['浅瀬','さんご礁','青の層','光のとどく底','静かな深み','月の届かない海','まっくらな海溝'];

/* ---- deep-sea creatures: from 26 m down, one sometimes appears with a "ボワン" ---- */
const CREA=[
 {id:'menda',name:'メンダコ',from:3,note:'耳のようなヒレを、パタパタさせて泳ぎます'},
 {id:'kurage',name:'クラゲ',from:3,note:'ほのかに光りながら、ただよっています'},
 {id:'anko',name:'チョウチンアンコウ',from:4,note:'頭のちょうちんで、えものをおびきよせます'},
 {id:'gusoku',name:'ダイオウグソクムシ',from:5,note:'何年も食べなくても平気な、深海のだんごむし'},
 {id:'ryugu',name:'リュウグウノツカイ',from:6,note:'めったに会えない、銀色の長い魚'}
];
/* from the 2nd dive on, a different crowd lives in the sea (even-numbered dives) */
const CREA2=[
 {id:'umiera',name:'ウミエラ',from:3,note:'鳥の羽のような形をした、サンゴのなかま。ふれると、ぽわっと青白く光ります',pop:'ぽわっ'},
 {id:'umishida',name:'ウミシダ',from:3,note:'ウミユリのなかま。羽のような腕をばさばさ動かして泳ぎます',pop:'ばさばさ'},
 {id:'hourai',name:'ホウライエソ',from:4,note:'口に入りきらないほど長いキバ。お腹の光る点で、えものをさそいます',pop:'ガバッ',scary:1},
 {id:'fringe',name:'サーカスティック・フリンジヘッド',from:4,note:'ふだんは穴や貝がらにかくれる小さな魚。おこると口を大きく広げて、相手と大きさくらべをします',pop:'がばっ！'},
 {id:'oni',name:'オニキンメ',from:5,note:'体のわりにとても大きな、ギザギザのキバ。口をとじると、キバは頭のくぼみにおさまります',pop:'ガチガチ',scary:1},
 {id:'mitsukuri',name:'ミツクリザメ',from:6,note:'ピンク色の深海のサメ。えものを見つけると、あごが引き出しのように前へ飛び出します',pop:'ガシャッ',scary:1}
];
/* 3rd sea: the frozen Antarctic deep */
const CREA3=[
 {id:'umigumo',name:'ダーリアウミグモ',from:3,note:'南極の海の、手のひらより大きいウミグモ。体はとても小さく、長い脚ばかり',pop:'わしゃっ'},
 {id:'koori',name:'コオリウオ',from:3,note:'血が赤くない、すき通った魚。冷たい南極の海でくらします',pop:'すけっ'},
 {id:'clione',name:'ハダカカメガイ（クリオネ）',from:4,note:'天使のような姿。でも、えものを見つけると頭がひらいて触手が出てきます',pop:'くぱっ',scary:1},
 {id:'hozuki',name:'ダイオウホウズキイカ',from:5,note:'南極の深海の巨大イカ。目は動物の中でいちばん大きいといわれます',pop:'ギョロッ',scary:1}
];
/* 4th sea: the lake at the bottom of the sea */
const CREA4=[
 {id:'taru',name:'オオタルマワシ',from:3,note:'すき通ったタルの中にすむ小さな生き物。タルを押しながら泳ぎます',pop:'ぐるん'},
 {id:'yurei',name:'ユウレイイカ',from:3,note:'体がすき通った、ゆうれいのようなイカ。長い腕の先が光ります',pop:'ぼうっ'},
 {id:'jumonji',name:'ジュウモンジダコ',from:4,note:'耳のようなヒレで泳ぐタコ。かさを風船のようにふくらませます',pop:'ふわっ'},
 {id:'fukuro',name:'フクロウナギ',from:5,note:'体のわりに、口がとても大きなウナギ。口を袋のようにふくらませて、えものをまるのみ',pop:'ガバァ',scary:1}
];
/* 5th sea: the deepest trench */
const CREA5=[
 {id:'kusauo',name:'シンカイクサウオ',from:3,note:'水深8000mでも暮らせる、ぷるぷるの魚。とても深い海溝にすみます',pop:'ぷるるん'},
 {id:'senju',name:'センジュナマコ',from:3,note:'ピンク色の、歩くナマコ。海の底をのそのそ歩いて、泥の中のえさを食べます',pop:'のそっ'},
 {id:'kaikou',name:'カイコウオオソコエビ',from:4,note:'海溝の底にすむ、大きなヨコエビのなかま',pop:'くるっ'},
 {id:'atolla',name:'ムラサキカムリクラゲ',from:5,note:'おそわれると、ふちの光をくるくる回して、まわりに知らせるクラゲ',pop:'ピカピカ'}
];
const CREAS=[CREA,CREA2,CREA3,CREA4,CREA5];
const ALLC=[].concat(...CREAS);
const SEANAMES=['はじまりの海','こわい顔の海','凍える南極の海','海の底の湖','いちばん深い海溝'];
function seaN(){return((returns%5)+5)%5}
function seaB(){return seaN()===1}
function curCrea(){return CREAS[seaN()]}
let crTap=0;
function tapOpen(hold){if(crTap<=0)return 0;return Math.min(1,crTap/.18)*(crTap>hold?Math.max(0,1-(crTap-hold)/.35):1)}
/* creatures met only during the milestone events */
const EXTRA=['kujira','yakochu','ebi','ika','deme','umiyuri','blob','hoya','honekui','nuta','tube','kani','chin','nishiki','okiami','hibari','yokoebi','kudakurage'];
const ZTOTAL=ALLC.length+EXTRA.length;
let met=[];try{met=JSON.parse(localStorage.getItem('awa-met')||'[]')}catch(e){}
let cr=null,crT=5,pops=[],returns=0;
try{returns=+localStorage.getItem('awa-return')||0}catch(e){}
let evt=null,pendingEvt=null,seqI=0,nextAt=50;
function showMet(){$('zukan').textContent='であった生き物 '+met.length+' / '+ZTOTAL}
showMet();
function meet(id){
  if(met.includes(id))return false;
  met.push(id);try{localStorage.setItem('awa-met',JSON.stringify(met))}catch(e){}
  showMet();return true;
}
function crSize(){return Math.max(46,Math.min(72,Math.min(W,H)*.125))}
function crScale(c){const p=Math.min(1,c.age/.6),k=1.9;return 1+(k+1)*Math.pow(p-1,3)+k*Math.pow(p-1,2)}
function spawnCreature(){
  const L=level(),pool=curCrea().filter(c=>L>=c.from),fresh=pool.filter(c=>!met.includes(c.id));
  const list=(fresh.length&&Math.random()<.6)?fresh:pool,c=list[Math.floor(Math.random()*list.length)];
  const dir=Math.random()<.5?1:-1,S=crSize();
  cr={c,x:W*(.25+Math.random()*.5),y:H*(.38+Math.random()*.3),dir,S,age:0,life:13,tapped:0,ph:Math.random()*6.28,vx:dir*S*.35};
  bits.push({ring:1,x:cr.x,y:cr.y,r:S*1.1,life:1,pearl:false},{ring:1,x:cr.x,y:cr.y,r:S*.6,life:1,pearl:false});
  for(let i=0;i<12;i++){const a=Math.random()*6.28,s=60+Math.random()*90;bits.push({x:cr.x,y:cr.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.5+Math.random()*3,life:1})}
  pops.push({x:cr.x,y:cr.y-S*1.3,life:1,txt:'ボワン'});
  bwoon();
}
function bwoon(){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(230,n);o.frequency.exponentialRampToValueAtTime(70,n+.55);
  l.frequency.value=14;lg.gain.value=20;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.3,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.7);
  o.connect(g).connect(actx.destination);o.start(n);l.start(n);o.stop(n+.75);l.stop(n+.75);
}
function happy(){
  if(!soundOn||!actx)return;
  [523.25,783.99].forEach((f,i)=>{const n=actx.currentTime+i*.12,o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.14,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+.35);o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.4)});
}
function hitCreature(px,py){
  if(!cr||cr.tapped)return false;
  const sc=Math.max(.3,crScale(cr)),HB={ryugu:[2.2,.9],mitsukuri:[1.7,.8],hourai:[1.5,.8],fringe:[1.2,.8],oni:[1.1,.9],umiera:[.75,1.3],umishida:[1.15,1.1],umigumo:[1.3,.9],koori:[1.5,.7],clione:[.6,1.1],hozuki:[1.6,.9],taru:[.9,1],yurei:[1.4,.9],jumonji:[1.1,1],fukuro:[1.5,.9],kusauo:[1.3,.8],senju:[1.2,.9],kaikou:[1.2,.8],atolla:[1,1.1]}[cr.c.id]||[1.05,.9];
  const cyy=cr.c.id==='umiera'?cr.y-cr.S*.2*sc:cr.y;
  const dx=(px-cr.x)/(cr.S*HB[0]*sc+14),dy=(py-cyy)/(cr.S*HB[1]*sc+14);
  if(dx*dx+dy*dy>1)return false;
  cr.tapped=.001;score+=3;happy();
  const first=meet(cr.c.id);
  pops.push({x:cr.x,y:cr.y-cr.S*1.3,life:1,txt:'+3'});
  if(cr.c.pop){pops.push({x:cr.x,y:cr.y-cr.S*.7,life:1.1,txt:cr.c.pop,col:cr.c.scary?'#ffb0a0':'#c8fff0'});

function stepCreature(dt){

  if(!cr){

  }

  if(cr.tapped){cr.tapped+=dt;if(cr.tapped>(cr.c.pop?2.2:1.4))cr.vx+=cr.dir*cr.S*4*dt}
  cr.x+=cr.vx*dt;cr.y+=Math.sin(cr.ph*1.3)*cr.S*.25*dt;

function pop(pearl){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';const f=pearl?880:420+Math.random()*260;
  o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*2.2,n+.07);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(pearl?.18:.12,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+(pearl?.5:.16));
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.6);
}
function noise(len,type,freq,vol){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,buf=actx.createBuffer(1,Math.floor(actx.sampleRate*len),actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=buf;f.type=type;f.frequency.value=freq;g.gain.value=vol;
  s.connect(f).connect(g).connect(actx.destination);s.start(n);
}

/* ---- 巨大イカの影: a huge squid shadow rises and reaches up with its arms ---- */
let squid=null,inks=[];
function startSquid(){
  const n=W<500?5:7;squid={rise:0,blink:0,eyeT:3,eyes:[],tents:[]};
  for(let i=0;i<n;i++)squid.tents.push({bx:W*(i+.5)/n,ext:0,state:'wait',cd:1.5+i*.4+Math.random(),tx:0,ty:0,
    ph:Math.random()*6,w:Math.max(9,Math.min(W,H)*.026),hold:0,fast:0,pts:[]});

function aimTent(t){t.tx=Math.max(30,Math.min(W-30,t.bx+(Math.random()-.5)*W*.5));t.ty=H*(.28+Math.random()*.4);t.state='out';t.hold=0}
function stepSquid(dt){
  const s=squid,e=evt;if(!s)return;

  s.rise+=((fin?0:1)-s.rise)*Math.min(1,dt*(fin?1.3:.6));
  s.eyeT-=dt;if(s.eyeT<=0){s.blink=.3;s.eyeT=2.5+Math.random()*3}
  if(s.blink>0)s.blink-=dt;
  for(const t of s.tents){t.ph+=dt;
    if(fin&&t.state==='out')t.state='back';
    if(t.state==='wait'){t.cd-=dt;if(t.cd<=0&&!fin)aimTent(t)}
    else if(t.state==='out'){t.ext=Math.min(1,t.ext+dt*.4);if(t.ext>=1){t.hold+=dt;if(t.hold>3.5)t.state='back'}}
    else{t.ext-=dt*(t.fast?3:1);if(t.ext<=0){t.ext=0;t.state='wait';t.fast=0;t.cd=1+Math.random()*2.2}}

function tentPts(t,time){

  const dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pts=[];
  for(let i=0;i<=16;i++){const f=i/16,wv=Math.sin(f*4-time*2.2+t.ph)*Math.min(60,L*.14)*f;

    for(let i=0;i<p.length;i++){
      const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,f=p[i][2];
      const w=tn.w*(1-f*.6)*(f>.75?1+Math.sin((f-.75)/.25*Math.PI)*.7:1);   // club-shaped tip
      Lf.push([p[i][0]-dy/l*w,p[i][1]+dx/l*w]);Rt.push([p[i][0]+dy/l*w,p[i][1]-dx/l*w]);
    }
    cx.fillStyle='rgba(66,18,40,.95)';cx.beginPath();
    Lf.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));
    const tip=p[p.length-1];cx.arc(tip[0],tip[1],tn.w*.42,0,TAU);
    for(let i=Rt.length-1;i>=0;i--)cx.lineTo(Rt[i][0],Rt[i][1]);
    cx.closePath();cx.fill();
    cx.fillStyle='rgba(255,190,205,.32)';
    for(let i=9;i<p.length;i++){const q=Lf[i];cx.beginPath();cx.arc((q[0]+p[i][0])/2,(q[1]+p[i][1])/2,tn.w*.16,0,TAU);cx.fill()}

}

function hitChest(px,py){

function demeEye(){const d=deme;return[d.x+d.dir*d.L*.19,d.y-d.h*.24]}
function stepDeme(dt){
  const d=deme;if(!d)return;const e=evt;
  const fast=(W+d.L*1.2)/4.2,slow=W*.025,rem=(W*.5-d.dir*W*.06-d.x)*d.dir;
  const vt=e.t>e.len-4.5?fast:Math.max(slow,Math.min(fast,rem*1.1));
  d.v+=(vt-d.v)*Math.min(1,dt*3);d.x+=d.dir*d.v*dt;
  d.cd-=dt;if(d.look>0)d.look-=dt;
  // the green eyes follow the nearest bubble (or roll straight up after a touch)
  const [ex,ey]=demeEye();let best=1e9,tgt=-.25;
  if(d.look>0)tgt=-Math.PI/2;
  else for(const b of bubbles){const dx=b.x-ex,dy=b.y-ey,q=dx*dx+dy*dy;
    if(q<best){best=q;tgt=Math.atan2(dy,dx*d.dir)}}
  tgt=Math.max(-1.75,Math.min(.35,tgt));
  d.ang+=(tgt-d.ang)*Math.min(1,dt*4);
}
function hitDeme(px,py){
  const d=deme;if(!d||!evt||evt.kind!=='deme')return false;
  const dx=(px-(d.x+d.dir*d.L*.03))/(d.L*.45+12),dy=(py-(d.y-d.h*.1))/(d.h*.7+12);
  if(dx*dx+dy*dy>1)return false;
  if(d.cd<=0){
    d.cd=.8;d.look=1.4;peek();
    const [ex,ey]=demeEye();
    for(let i=0;i<5;i++){const r=9+Math.random()*8;
      bubbles.push({x:ex+(Math.random()-.5)*d.L*.15,y:ey-d.h*.8,r,sp:90+Math.random()*60,ph:Math.random()*6.28,wf:1.2,wa:16,
        hue:110+Math.random()*40,pearl:false,glow:true,born:.2})}
    pops.push({x:ex,y:ey-d.h*1.1,life:1,txt:'きょろっ',col:'#a8ffbe'});
  }
  return true;
}
function peek(){
  if(!soundOn||!actx)return;
  [659.25,987.77].forEach((f,i)=>{const n=actx.currentTime+i*.08,o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.25,n+.1);
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.1,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.3);
    o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.35)});
}
function drawDeme(t){
  const d=deme;if(!d||!evt)return;
  const L=d.L,h=d.h;
  const a=Math.max(0,Math.min(1,evt.t/1.2,(evt.len-evt.t)/1.2));

  cx.save();

  for(let i=-3;i<=3;i++){

  cx.beginPath();
  cx.moveTo(-L*.2,h*.38);

  cx.quadraticCurveTo(-L*.06,h*.48,-L*.2,h*.38);
  cx.fill();
  // 丸くて黒っぽい魚体
  const bg=cx.createLinearGradient(0,-h*.5,0,h*.5);

  bg.addColorStop(1,'#211b18');
  cx.fillStyle=bg;
  cx.beginPath();
  cx.ellipse(-L*.05,0,L*.34,h*.52,0,0,Math.PI*2);
  cx.fill();
  const sheen=cx.createRadialGradient(-L*.12,-h*.3,1,-L*.12,-h*.3,L*.25);
  sheen.addColorStop(0,'rgba(140,105,85,.2)');
  sheen.addColorStop(1,'rgba(140,105,85,0)');
  cx.fillStyle=sheen;
  cx.beginPath();
  cx.ellipse(-L*.05,0,L*.34,h*.52,0,0,Math.PI*2);
  cx.fill();
  // 透明ドームの中の顔
  const hx=L*.2,hy=-h*.05,rx=L*.22,ry=h*.47;
  cx.save();
  cx.beginPath();
  cx.ellipse(hx,hy,rx,ry,0,0,Math.PI*2);
  cx.clip();
  const face=cx.createRadialGradient(L*.27,h*.02,2,L*.24,0,L*.26);
  face.addColorStop(0,'#a9bec2');

  face.addColorStop(1,'rgba(35,48,55,.95)');
  cx.fillStyle=face;
  cx.fillRect(hx-rx,hy-ry,rx*2,ry*2);
  // 透けて見える白いもやもや
  cx.strokeStyle='rgba(240,242,235,.38)';
  cx.lineWidth=1.2;
  for(let i=0;i<7;i++){
    const sx=L*(.04+i*.018);
    cx.beginPath();
    cx.moveTo(sx,-h*.42+i*h*.02);
    cx.bezierCurveTo(sx+L*.04,-h*.3,sx-L*.01,-h*.15,sx+L*.03,-h*.02+Math.sin(t+i)*2);
    cx.stroke();
  }
  // 体との境目をなじませる影
  const shade=cx.createLinearGradient(hx-rx,0,hx-rx*.35,0);
  shade.addColorStop(0,'rgba(20,16,15,.95)');

  cx.fillRect(hx-rx,hy-ry,rx,ry*2);
  const chin=cx.createLinearGradient(0,h*.15,0,h*.42);
  chin.addColorStop(0,'rgba(20,25,30,0)');
  chin.addColorStop(1,'rgba(20,25,30,.6)');
  cx.fillStyle=chin;
  cx.fillRect(hx-rx,h*.15,rx*2,h*.3);
  // 上を向いた緑の目（ほのかに光る）
  // 上を向いた筒状の緑の目（泡のほうへ少しだけ傾く）
  const tilt=Math.max(-.35,Math.min(.35,(d.ang+Math.PI/2)*.3));
  for(let i=0;i<2;i++){
    cx.save();
    cx.globalAlpha=a*(i?1:.7);
    cx.translate(L*(.14+i*.075),-h*.04);
    cx.rotate(tilt);

    tube.addColorStop(1,'rgba(20,70,52,.85)');
    cx.fillStyle=tube;
    cx.beginPath();

    cx.lineTo(ew*.5,-len);
    cx.lineTo(ew*.4,0);
    cx.closePath();
    cx.fill();
    cx.fillStyle='rgba(140,255,170,'+(.12+.1*pulse)+')';
    cx.beginPath();
    cx.ellipse(0,-len,ew*1.1,ew*.85,0,0,Math.PI*2);
    cx.fill();
    const lens=cx.createRadialGradient(-ew*.15,-len-ew*.15,1,0,-len,ew*.6);
    lens.addColorStop(0,'#eaffc8');
    lens.addColorStop(.4,'#9ce684');
    lens.addColorStop(.8,'#3f9c5e');
    lens.addColorStop(1,'#1d5a40');
    cx.fillStyle=lens;
    cx.beginPath();
    cx.ellipse(0,-len,ew*.6,ew*.45,0,0,Math.PI*2);
    cx.fill();
    cx.fillStyle='rgba(255,255,235,.9)';
    cx.beginPath();
    cx.ellipse(-ew*.22,-len-ew*.18,ew*.16,ew*.09,-.3,0,Math.PI*2);
    cx.fill();
    cx.restore();
  }
  // 目に見える鼻の穴（つぶらで少し不気味）
  const nos=[[L*.355,-h*.08,h*.04],[L*.32,-h*.02,h*.058]];
  for(const [nx,ny,nr] of nos){
    cx.fillStyle='rgba(190,210,215,.5)';
    cx.beginPath();
    cx.ellipse(nx,ny,nr*1.25,nr*1.15,0,0,Math.PI*2);
    cx.fill();
    cx.fillStyle='#141b1f';
    cx.beginPath();
    cx.ellipse(nx,ny,nr,nr*.92,0,0,Math.PI*2);
    cx.fill();
    cx.fillStyle='rgba(255,255,255,.85)';
    cx.beginPath();
    cx.arc(nx-nr*.35,ny-nr*.35,nr*.25,0,Math.PI*2);
    cx.fill();
  }
  cx.restore();
  // おちょぼ口
  cx.strokeStyle='rgba(25,30,35,.85)';
  cx.lineWidth=1.6;
  cx.lineCap='round';
  cx.beginPath();
  cx.moveTo(L*.415,h*.15);
  cx.quadraticCurveTo(L*.39,h*.21,L*.355,h*.19);
  cx.stroke();
  cx.fillStyle='rgba(150,165,170,.6)';
  cx.beginPath();
  cx.ellipse(L*.4,h*.2,h*.03,h*.02,.4,0,Math.PI*2);
  cx.fill();
  // 筋の入った黒い胸びれ
  const fw=Math.sin(t*1.8)*.15;
  cx.save();
  cx.translate(-L*.02,h*.18);
  cx.rotate(.25+fw);
  cx.fillStyle='rgba(38,30,26,.9)';
  cx.beginPath();
  cx.moveTo(0,0);
  cx.bezierCurveTo(-L*.1,h*.05,-L*.2,h*.25,-L*.2,h*.42);
  cx.bezierCurveTo(-L*.1,h*.4,-L*.02,h*.25,L*.03,h*.08);
  cx.closePath();
  cx.fill();
  cx.strokeStyle='rgba(130,100,85,.35)';
  cx.lineWidth=.8;
  for(let i=1;i<6;i++){
    cx.beginPath();
    cx.moveTo(0,h*.02);
    cx.lineTo(-L*.2+i*L*.035,h*.42-i*h*.05);
    cx.stroke();
  }
  cx.restore();
  // ドームの輪郭とガラスの反射
  cx.strokeStyle='rgba(200,240,250,.45)';
  cx.lineWidth=1.2;
  cx.beginPath();
  cx.ellipse(hx,hy,rx,ry,0,-2.2,2.0);
  cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.6)';
  cx.lineWidth=2.4;
  cx.beginPath();
  cx.ellipse(hx,hy,rx*.86,ry*.86,0,-1.95,-1.25);
  cx.stroke();
  cx.fillStyle='rgba(255,255,255,.5)';
  cx.beginPath();
  cx.ellipse(hx+rx*.45,hy-ry*.55,rx*.06,ry*.04,-.6,0,Math.PI*2);
  cx.fill();
  cx.restore();
}

/* ---- ウミユリの森: white sea lilies sway on the floor; touch to close them, and they may swim away ---- */
let lilies=[],swimmers=[];
function floorY(x){return H*.88-Math.sin(x/W*Math.PI*2+.6)*H*.025}
function newLily(x,delay){
  const s=Math.max(.8,Math.min(1.25,Math.min(W,H)/440));
  return{x,hh:H*(.16+Math.random()*.2),R:(32+Math.random()*16)*s,ph:Math.random()*6,o:1,ot:1,taps:0,reopen:0,cd:0,
    g:-(delay||0),hue:25+Math.random()*25,tx:0,ty:0}
}
function startLily(){
  const n=W<500?6:8;lilies=[];swimmers=[];
  for(let i=0;i<n;i++)lilies.push(newLily(W*(i+.5)/n+(Math.random()-.5)*W/n*.45,.6+i*.25+Math.random()*.3));
  evt.auto=7;
}
function lilyTop(l,t){
  const fy=floorY(l.x),gg=Math.max(0,Math.min(1,l.g)),hh=l.hh*gg,sway=Math.sin(t*.9+l.ph)*hh*.13;
  return{fx:l.x,fy,hh,sway,x:l.x+sway,y:fy-hh,tilt:sway/(l.hh+1)*.9};
}
function releaseLily(i,t){
  const l=lilies[i],p=lilyTop(l,t);
  swimmers.push({x:p.x,y:p.y-l.R*.4,R:l.R,hue:l.hue,ph:l.ph,st:Math.PI,vx:(Math.random()-.5)*20,vy:-30,cd:0,o:.5});
  pops.push({x:p.x,y:p.y-l.R*1.3,life:1,txt:'すいー',col:'#fff2e6'});
  lilies[i]=newLily(l.x,1.2);
  chime(1046.5);
}
function stepLily(dt){
  const e=evt,t=performance.now()/1000;
  for(const l of lilies){
    l.g+=dt*.55;l.cd-=dt;
    if(l.ot===0){l.reopen-=dt;if(l.reopen<=0)l.ot=1}
    l.o+=(l.ot-l.o)*Math.min(1,dt*(l.ot<l.o?10:2.2));
  }
  e.auto-=dt;
  if(e.auto<=0&&e.t<e.len-5){e.auto=5+Math.random()*4;
    const ok=lilies.map((l,i)=>l.g>=1?i:-1).filter(i=>i>=0);
    if(ok.length)releaseLily(ok[Math.floor(Math.random()*ok.length)],t)}
}
function stepSwimmers(dt){
  for(let i=swimmers.length-1;i>=0;i--){const s=swimmers[i];
    s.st+=dt*2.6;s.cd-=dt;s.ph+=dt;
    const pull=Math.max(0,Math.sin(s.st));        // arms sweep down -> lily goes up
    s.o=.55+.45*Math.cos(s.st);
    s.vy+=(-(25+70*pull)-s.vy)*Math.min(1,dt*3);
    s.x+=(s.vx+Math.sin(s.ph*1.3)*18)*dt;s.y+=s.vy*dt;
    if(s.y<-s.R*3)swimmers.splice(i,1)}
}
function hitLily(px,py){
  if(!evt||evt.kind!=='lily')return false;
  const t=performance.now()/1000;
  for(const s of swimmers){const dx=px-s.x,dy=py-s.y;
    if(dx*dx+dy*dy<=(s.R+16)**2){
      if(s.cd<=0){s.cd=.5;s.vy-=110;s.st=Math.PI*.5;score+=2;evt.n++;$('evn').textContent=evt.n;chime(880);
        pops.push({x:s.x,y:s.y-s.R,life:.9,txt:'ふわっ',col:'#fff2e6'});update()}
      return true}}
  for(let i=0;i<lilies.length;i++){const l=lilies[i];if(l.g<.7)continue;
    const p=lilyTop(l,t),cxp=p.x,cyp=p.y-l.R*.45,dx=px-cxp,dy=py-cyp;
    if(dx*dx+dy*dy<=(l.R*.85+16)**2){
      if(l.cd>0)return true;
      l.cd=.3;l.ot=0;l.reopen=1.6;l.taps++;score+=2;evt.n++;$('evn').textContent=evt.n;
      for(let k=0;k<8;k++){const a=Math.random()*TAU,v=30+Math.random()*60;
        bits.push({x:cxp,y:cyp,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*1.8,life:.8,col:'#fff2e6'})}
      if(l.taps>=3){score+=3;releaseLily(i,t);pops.push({x:cxp,y:cyp-l.R,life:1,txt:'+5',col:'#fff2e6'})}
      else{chime(659.25);pops.push({x:cxp,y:cyp-l.R*.9,life:.8,txt:'きゅっ',col:'#fff2e6'})}
      update();return true}
  }
  return false;
}
function chime(f){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*.75,n+.25);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.1,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.45);
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.5);
}
function drawCrown(x,y,R,o,tilt,t,ph,hue){
  cx.save();cx.translate(x,y);cx.rotate(tilt);
  const arm=`hsla(${hue},45%,90%,.95)`,pin=`hsla(${hue},40%,86%,.6)`;
  cx.lineCap='round';
  for(let k=0;k<8;k++){
    const side=(k-3.5)/3.5,a0=-Math.PI/2+side*(.18+1.1*o),len=R*(.9+.1*Math.sin(k*1.7));
    let ax=0,ay=0,pts=[[0,0,a0]];
    for(let j=1;j<=10;j++){const f=j/10,ang=a0+Math.sign(side||.1)*(o*.75-(1-o)*1.1)*f*f+Math.sin(t*1.5+ph+k*.9)*.08*f;
      ax+=Math.cos(ang)*len/10;ay+=Math.sin(ang)*len/10;pts.push([ax,ay,ang])}
    // the little side branches make the arm look like a row of ribs
    cx.strokeStyle=pin;cx.lineWidth=Math.max(1,R*.025);cx.beginPath();
    for(let j=2;j<=10;j++){const [qx,qy,ang]=pts[j],pl=R*.14*(1-j/10*.5)*(.35+.65*o);
      for(const sd of[-1,1]){const pa=ang+sd*(1.25-(1-o)*.6);cx.moveTo(qx,qy);cx.lineTo(qx+Math.cos(pa)*pl,qy+Math.sin(pa)*pl)}}
    cx.stroke();
    cx.strokeStyle=arm;cx.lineWidth=Math.max(1.5,R*.06);cx.beginPath();
    pts.forEach(([qx,qy],j)=>j?cx.lineTo(qx,qy):cx.moveTo(qx,qy));cx.stroke();
  }
  cx.fillStyle=`hsl(${hue},35%,80%)`;cx.beginPath();cx.ellipse(0,R*.02,R*.13,R*.1,0,0,TAU);cx.fill();
  cx.restore();
}
function drawLily(t){
  if(!evt||evt.kind!=='lily')return;
  const e=evt,a=Math.max(0,Math.min(1,e.t/1.2,(e.len-e.t)/1.5));if(a<=0)return;
  cx.save();cx.globalAlpha=a;
  cx.fillStyle='rgba(0,6,16,.35)';cx.fillRect(0,0,W,H);
  const fg=cx.createLinearGradient(0,H*.83,0,H);fg.addColorStop(0,'#2c3a44');fg.addColorStop(1,'#0b1117');
  cx.fillStyle=fg;cx.beginPath();cx.moveTo(0,H);
  for(let x=0;x<=W+10;x+=10)cx.lineTo(x,floorY(x));
  cx.lineTo(W,H);cx.closePath();cx.fill();
  cx.fillStyle='rgba(200,215,225,.18)';
  for(let i=0;i<22;i++){const x=(i*131.7%1000)/1000*W;cx.beginPath();cx.ellipse(x,floorY(x)+6+(i*7%11),3+(i%3)*2,1.5,0,0,TAU);cx.fill()}
  for(const l of lilies){if(l.g<=0)continue;
    const p=lilyTop(l,t),gg=Math.min(1,l.g);
    // stalk with little whorls along it
    cx.strokeStyle=`hsla(${l.hue},25%,78%,.9)`;cx.lineWidth=Math.max(1.5,l.R*.08);cx.lineCap='round';
    const qx=p.fx+p.sway*.25,qy=p.fy-p.hh*.55;
    cx.beginPath();cx.moveTo(p.fx,p.fy);cx.quadraticCurveTo(qx,qy,p.x,p.y);cx.stroke();
    cx.strokeStyle=`hsla(${l.hue},30%,82%,.55)`;cx.lineWidth=1;cx.beginPath();
    const N=Math.max(2,Math.floor(p.hh/16));
    for(let k=1;k<N;k++){const f=k/N,x=(1-f)*(1-f)*p.fx+2*(1-f)*f*qx+f*f*p.x,y=(1-f)*(1-f)*p.fy+2*(1-f)*f*qy+f*f*p.y,c=l.R*.14;
      cx.moveTo(x,y);cx.quadraticCurveTo(x-c,y-c*.2,x-c*1.1,y+c*.5);cx.moveTo(x,y);cx.quadraticCurveTo(x+c,y-c*.2,x+c*1.1,y+c*.5)}
    cx.stroke();
    drawCrown(p.x,p.y,l.R*gg,l.o,p.tilt,t,l.ph,l.hue);
  }
  for(const s of swimmers)drawCrown(s.x,s.y,s.R,s.o,Math.sin(s.ph)*.15,t,s.ph,s.hue);
  cx.restore();
}

/* ---- ブロブフィッシュ: a droopy jelly fish sits on the floor; poke it, and poke it fast to make it smile ---- */
let blob=null;
function startBlob(){
  const S=Math.max(60,Math.min(W*.22,110));

/* ---- クジラの骨の森 (2nd sea): a whale skeleton on the floor, covered with countless tiny
   bone-eating worms that pull in when touched; hagfish slither out of the bones ---- */
let bone=null,worms=[],hags=[],slime=[];

  const b=bone,L=b.L,x0=b.x0,F=boneFloor,out=[];
  // skull (a low dome, facing left)
  const sk=[];for(let i=0;i<=24;i++){const f=i/24,x=x0+L*.02+f*L*.26,y=F(x)-H*.012-Math.sin(Math.pow(f,.8)*Math.PI)*H*.085;sk.push([x,y])}
  out.push({kind:'skull',pts:sk});
  // lower jaw lying on the sand
  const jw=[];for(let i=0;i<=16;i++){const f=i/16,x=x0+L*.25-f*L*.27,y=F(x)-H*.012-Math.sin(f*Math.PI)*H*.018;jw.push([x,y])}
  out.push({kind:'jaw',pts:jw});
  // spine
  const sp=[];for(let i=0;i<=30;i++){const f=i/30,x=x0+L*.28+f*L*.7,y=F(x)-H*.03-Math.sin(f*Math.PI)*H*.025+f*H*.01;sp.push([x,y])}
  out.push({kind:'spine',pts:sp});
  // fallen ribs arching over the spine

    const pts=[];for(let i=0;i<=18;i++){const f=i/18,cxp=s[0]+L*.035,cyp=s[1]-hh*1.6;
      const x=(1-f)*(1-f)*s[0]+2*(1-f)*f*cxp+f*f*ex,y=(1-f)*(1-f)*s[1]+2*(1-f)*f*cyp+f*f*F(ex);pts.push([x,y])}
    out.push({kind:'rib',pts})}
  return out;
}
function startBone(){
  const L=Math.min(W*.96,600);bone={L,x0:W/2-L/2,auto:4.5,hagT:5,hagN:0,met:false,paths:null};
  worms=[];hags=[];bone.paths=bonePaths();
  const sc=Math.max(1,Math.min(W,H)/420);
  for(const p of bone.paths){const P=p.pts;
    let acc=0;
    for(let i=1;i<P.length;i++){const [ax,ay]=P[i-1],[bx,by]=P[i],dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1;
      let nx=-dy/l,ny=dx/l;if(ny>0){nx=-nx;ny=-ny}
      const step=p.kind==='rib'?3.4:4.2;
    for(acc+=l;acc>=step;acc-=step){const f=Math.random(),x=ax+dx*f,y=ay+dy*f;
        const rows=p.kind==='spine'||p.kind==='skull'?2:1;
        for(let k=0;k<rows;k++){const o=k*4+(Math.random()-.5)*2;
          worms.push({x:x-nx*o,y:y-ny*o,nx:nx+(Math.random()-.5)*.6,ny:ny+(Math.random()-.5)*.3,len:(5+Math.random()*8)*sc,s:sc,
            ph:Math.random()*6,out:0,grow:.6+Math.random()*2.2,hideAt:-1,back:-1})}}}
  }
}
function retract(cx0,cy0,R,speed,now){
  let n=0;
  for(const w of worms){const d=Math.hypot(w.x-cx0,w.y-cy0);if(d>R)continue;
    if(w.out>.5&&!(now>=w.hideAt&&now<w.back))n++;
    w.hideAt=now+d/speed;w.back=w.hideAt+1.2+Math.random()*.7}
  return n;
}
function stepBone(dt){
  const b=bone,e=evt;if(!b)return;const now=e.t,fin=e.t>e.len-2.5;
  for(const w of worms){
    const hidden=fin||now<w.grow||(now>=w.hideAt&&now<w.back);
    w.out+=((hidden?0:1)-w.out)*Math.min(1,dt*(hidden?16:2.2));w.ph+=dt;
  }
  // every few seconds a wave runs along the whole skeleton by itself
  b.auto-=dt;
  if(b.auto<=0&&!fin&&worms.length){b.auto=4+Math.random()*3;const w=worms[Math.floor(Math.random()*worms.length)];
    retract(w.x,w.y,W*1.2,260,now);hiss(.18)}
  b.hagT-=dt;
  if(b.hagT<=0&&!fin&&hags.length<4){b.hagT=2.5+Math.random()*3;spawnHag();
    if(!b.met){b.met=true;const first=meet('nuta');
      showToast('<b>ヌタウナギ'+(first?'<br>はじめまして！':'')+'</b>骨のすきまから、目のない細長い魚がにゅるり…。ふれると、ネバネバを出します',3400)}}
  for(let i=hags.length-1;i>=0;i--){const h=hags[i];h.ph+=dt;h.cd-=dt;h.fade=Math.min(1,h.fade+dt*.8);
    if(h.flee||fin){h.sp+=(260-h.sp)*Math.min(1,dt*2);h.a+=angDiff(Math.PI/2,h.a)*Math.min(1,dt*1.5)}
    else{const dx=h.tx-h.x,dy=h.ty-h.y;if(Math.hypot(dx,dy)<30||Math.random()<dt*.15)pickHag(h);
      h.a+=angDiff(Math.atan2(dy,dx),h.a)*Math.min(1,dt*1.4)}
    h.x+=Math.cos(h.a)*h.sp*dt;h.y+=Math.sin(h.a)*h.sp*dt;
    if(h.y>H+h.L||h.x<-h.L*1.5||h.x>W+h.L*1.5||h.y<-h.L)hags.splice(i,1)}
}
function pickHag(h){h.tx=W*(.08+Math.random()*.84);h.ty=H*(.5+Math.random()*.32)}
function spawnHag(){
  const w=worms[Math.floor(Math.random()*worms.length)]||{x:W/2,y:H*.8};
  const h={x:w.x,y:w.y,a:-Math.PI/2+(Math.random()-.5),ph:Math.random()*6,sp:45+Math.random()*25,tx:0,ty:0,flee:0,cd:0,fade:0,
    L:Math.max(80,Math.min(W,H)*.24)};
  pickHag(h);hags.push(h);
  retract(w.x,w.y,60,300,evt.t);
}
function hagPts(h){
  const N=18,seg=h.L/N,c=Math.cos(h.a),s=Math.sin(h.a),pts=[];
  for(let i=0;i<=N;i++){const f=i/N,wv=Math.sin(h.ph*7-i*.55)*h.L*.07*(f+.25);
    pts.push([h.x-c*i*seg-s*wv,h.y-s*i*seg+c*wv,f])}
  return pts;
}
function drawHag(h){
  const p=hagPts(h),L=h.L,Lf=[],Rt=[];
  for(let i=0;i<p.length;i++){const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)],dx=a[0]-b[0],dy=a[1]-b[1],l=Math.hypot(dx,dy)||1,
    w=L*.045*(i===0?.75:1-p[i][2]*.55);Lf.push([p[i][0]-dy/l*w,p[i][1]+dx/l*w]);Rt.push([p[i][0]+dy/l*w,p[i][1]-dx/l*w])}
  cx.save();cx.globalAlpha*=h.fade;
  cx.fillStyle='#a8878c';cx.beginPath();Lf.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));
  cx.arc(p[0][0],p[0][1],L*.034,h.a-Math.PI/2,h.a+Math.PI/2);
  for(let i=Rt.length-1;i>=0;i--)cx.lineTo(Rt[i][0],Rt[i][1]);cx.closePath();cx.fill();
  cx.strokeStyle='rgba(240,215,220,.25)';cx.lineWidth=1;cx.beginPath();Lf.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke();
  // the row of slime pores along its side
  cx.fillStyle='rgba(250,240,240,.75)';cx.beginPath();
  for(let i=2;i<p.length-2;i++){const q=Rt[i];const x=(q[0]*2+p[i][0])/3,y=(q[1]*2+p[i][1])/3;cx.moveTo(x+1.2,y);cx.arc(x,y,1.2,0,TAU)}
  cx.fill();
  // barbels and pale eyespots (it has no real eyes)
  const hx=p[0][0],hy=p[0][1],c=Math.cos(h.a),s=Math.sin(h.a);
  cx.strokeStyle='#c8a8ac';cx.lineWidth=1.2;cx.beginPath();
  for(const k of[-1.6,-.6,.6,1.6]){const bx=hx+c*L*.03-s*k*L*.012,by=hy+s*L*.03+c*k*L*.012;cx.moveTo(bx,by);
    cx.lineTo(bx+c*L*.05-s*k*L*.012+Math.sin(h.ph*9+k)*2,by+s*L*.05+c*k*L*.012)}
  cx.stroke();
  cx.fillStyle='rgba(225,200,205,.6)';cx.beginPath();cx.arc(hx-c*L*.06,hy-s*L*.06,L*.012,0,TAU);cx.fill();
  cx.restore();
}
function hitBone(px,py){
  if(!evt||evt.kind!=='bone'||!bone)return false;
  for(const h of hags){if(h.flee)continue;const p=hagPts(h);
    for(let i=0;i<12;i++){if((px-p[i][0])**2+(py-p[i][1])**2<=(h.L*.06+18)**2){
      h.flee=1;score+=2;slimeBurst(p[i][0],p[i][1]);
      pops.push({x:p[i][0],y:p[i][1]-26,life:1,txt:'ネバッ +2',col:'#e8f0f2'});update();return true}}}
  let near=false;for(const w of worms){if((px-w.x)**2+(py-w.y)**2<44*44){near=true;break}}
  if(!near)return false;
  const n=retract(px,py,95,380,evt.t);
  if(n>0){const g=Math.max(1,Math.round(n/8));score+=g;evt.n+=n;$('evn').textContent=evt.n;
    pops.push({x:px,y:py-30,life:.9,txt:'シュッ +'+g,col:'#ff9a9a'});hiss(.12);update()}
  return true;
}
function slimeBurst(x,y){
  noise(.5,'lowpass',300,.4);
  for(let i=0;i<26;i++){const a=Math.random()*TAU,v=20+Math.random()*90;
    slime.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:5+Math.random()*10,life:1.6+Math.random()*.6})}
}
function stepSlime(dt){for(let i=slime.length-1;i>=0;i--){const s=slime[i];s.life-=dt*.45;s.x+=s.vx*dt;s.y+=s.vy*dt;
  s.vx*=.93;s.vy*=.93;s.r+=dt*14;if(s.life<=0)slime.splice(i,1)}}
function drawSlime(){for(const s of slime){const a=Math.max(0,Math.min(1,s.life));
  cx.fillStyle=`rgba(225,238,242,${.13*a})`;cx.strokeStyle=`rgba(255,255,255,${.28*a})`;cx.lineWidth=1;
  cx.beginPath();cx.arc(s.x,s.y,s.r,0,TAU);cx.fill();cx.stroke()}}
function hiss(v){noise(.3,'highpass',2600,v)}
function drawBone(t){
  const e=evt;if(!e||e.kind!=='bone'||!bone)return;
  const a=Math.max(0,Math.min(1,e.t/1.4,(e.len-e.t)/1.5));if(a<=0)return;
  cx.save();cx.globalAlpha=a;seaFloor(.55);
  const vg=cx.createRadialGradient(W/2,H*.75,H*.1,W/2,H*.6,Math.max(W,H)*.8);vg.addColorStop(0,'rgba(60,0,10,0)');vg.addColorStop(1,'rgba(10,0,4,.55)');
  cx.fillStyle=vg;cx.fillRect(0,0,W,H);
  // bones
  const L=bone.L;
  for(const p of bone.paths){const P=p.pts;
    if(p.kind==='skull'){cx.fillStyle='#cfc6b0';cx.beginPath();cx.moveTo(P[0][0],boneFloor(P[0][0])+4);P.forEach(q=>cx.lineTo(q[0],q[1]));
      cx.lineTo(P[P.length-1][0],boneFloor(P[P.length-1][0])+4);cx.closePath();cx.fill();
      cx.fillStyle='#1a1214';cx.beginPath();cx.ellipse(P[16][0],P[16][1]+H*.03,L*.022,H*.014,0,0,TAU);cx.fill();continue}
    if(p.kind==='spine'){for(let i=0;i<P.length;i+=2){const [x,y]=P[i];cx.fillStyle='#d6cdb6';rr(x-L*.012,y-H*.008,L*.024,H*.026,3);cx.fill();
      cx.strokeStyle='#c4baa2';cx.lineWidth=L*.008;cx.beginPath();cx.moveTo(x,y);cx.lineTo(x-L*.006,y-H*.025);cx.stroke()}continue}
    cx.strokeStyle='#cbc2ab';cx.lineCap='round';cx.lineWidth=p.kind==='jaw'?L*.022:L*.013;
    cx.beginPath();P.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));cx.stroke();
    cx.strokeStyle='rgba(90,70,60,.35)';cx.lineWidth=1;cx.stroke();
  }
  // the worms: stalks, then all the little red plumes at once
  cx.strokeStyle='rgba(235,200,195,.7)';cx.lineWidth=1;cx.beginPath();
  for(const w of worms){if(w.out<.05)continue;const l=w.len*w.out,sw=Math.sin(t*2.2+w.ph)*1.6*w.out;
    w.tx=w.x+w.nx*l+sw;w.ty=w.y+w.ny*l;cx.moveTo(w.x,w.y);cx.lineTo(w.tx,w.ty)}
  cx.stroke();
  cx.fillStyle='#5a1418';cx.beginPath();
  for(const w of worms){cx.moveTo(w.x+1.4*w.s,w.y);cx.arc(w.x,w.y,1.4*w.s,0,TAU)}
  cx.fill();
  for(const col of['#c8202e','#ff5a5e']){cx.fillStyle=col;cx.beginPath();
    for(const w of worms){if(w.out<.25)continue;const r=(col==='#c8202e'?1.9:1.1)*w.s*w.out,o=1.6*w.s*w.out;
      for(const k of[0,2.1,4.2]){const x=w.tx+Math.cos(k+w.ph*.3)*o,y=w.ty+Math.sin(k+w.ph*.3)*o-o*.5;cx.moveTo(x+r,y);cx.arc(x,y,r,0,TAU)}}
    cx.fill()}
  for(const h of hags)drawHag(h);
  cx.restore();
}

/* ---- チンアナゴの砂地: garden eels poke out of the bright sand, all facing the current,
   and duck into their burrows when something comes close ---- */
let eels=[],eelFish=null;
function evFade(e,a,b){return Math.max(0,Math.min(1,e.t/(a||1.2),(e.len-e.t)/(b||1.5)))}
function hideEels(x,y,R,speed,now){
  let n=0;
  for(const e of eels){const d=Math.hypot(e.x-x,(e.y-y)*1.4);if(d>R)continue;
    if(e.out>.5&&!(now>=e.hideAt&&now<e.back))n++;
    e.hideAt=now+d/speed;e.back=e.hideAt+1.5+Math.random()*1.8}
  return n;
}
EV.garden={len:24,lb:['アナゴ','ひき'],bubbles:true,
  start(){
    eels=[];eelFish=null;const n=Math.round(Math.min(72,Math.max(38,W*H/8000)));
    for(let i=0;i<n;i++){const f=Math.pow(Math.random(),.8),s=(.5+f*.8)*vScale();
      eels.push({x:W*(.04+Math.random()*.92),y:H*(.6+f*.32),s,h:(42+Math.random()*30)*s,ph:Math.random()*6,out:0,
        hideAt:0,back:.8+Math.random()*2.8,nishiki:Math.random()<.25})}
    eels.sort((a,b)=>a.y-b.y);evt.fishT=5.5;evt.cur=Math.random()<.5?1:-1;
    const f1=meet('chin'),f2=meet('nishiki');
    showToast('<b>チンアナゴの砂地'+(f1?'<br>はじめまして！':'')+'</b>明るい砂地から、細長いアナゴたちがにょろっ。オレンジのしまはニシキアナゴ。ふれると、いっせいにシュッとかくれます',4000);
  },
  step(dt){
    const e=evt,now=e.t,fin=now>e.len-2.2;
    e.fishT-=dt;
    if(e.fishT<=0&&!fin&&!eelFish){e.fishT=6+Math.random()*3;const d=Math.random()<.5?1:-1;
      eelFish={x:d>0?-60:W+60,y:H*(.62+Math.random()*.2),d,v:W/3.2}}
    if(eelFish){eelFish.x+=eelFish.d*eelFish.v*dt;
      for(const q of eels)if(Math.abs(q.x-eelFish.x)<70&&Math.abs(q.y-eelFish.y)<H*.18&&!(now>=q.hideAt&&now<q.back)){q.hideAt=now;q.back=now+1.6+Math.random()*1.5}
      if(eelFish.x<-80||eelFish.x>W+80)eelFish=null}
    for(const q of eels){const hid=fin||(now>=q.hideAt&&now<q.back);
      q.out+=((hid?0:1)-q.out)*Math.min(1,dt*(hid?22:1.5));q.ph+=dt}
  },
  hit(px,py){
    let near=false;
    for(const q of eels){const hx=q.x,hy=q.y-q.h*q.out*.6;if((px-hx)**2+(py-hy)**2<(q.h*.6+26)**2){near=true;break}}
    if(!near)return false;
    const n=hideEels(px,py,120*vScale(),520,evt.t);
    if(n){const g=Math.max(1,Math.round(n/3));score+=g;evt.n+=n;$('evn').textContent=evt.n;
      pops.push({x:px,y:py-34,life:.9,txt:'シュッ +'+g,col:'#fff3d6'});hiss(.1);update()}

  },
  draw(t){

    cx.save();cx.globalAlpha=a;
    cx.fillStyle='rgba(120,220,230,.12)';cx.fillRect(0,0,W,H);
    const top=H*.56,sg=cx.createLinearGradient(0,top,0,H);sg.addColorStop(0,'#cdbd92');sg.addColorStop(1,'#9c8a62');
    cx.fillStyle=sg;cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W+10;x+=10)cx.lineTo(x,top+Math.sin(x*.012)*6);cx.lineTo(W,H);cx.closePath();cx.fill();
    cx.strokeStyle='rgba(255,250,225,.22)';cx.lineWidth=1.2;
    for(let r=0;r<6;r++){const y0=top+20+r*(H-top)/6;cx.beginPath();for(let x=0;x<=W+10;x+=8){const y=y0+Math.sin(x*.05+r)*3;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}
    // flickering sunlight on the sand
    cx.save();cx.globalCompositeOperation='lighter';cx.fillStyle='rgba(255,255,230,.05)';
    for(let i=0;i<14;i++){const x=(i*137%100)/100*W+Math.sin(t*.7+i)*20,y=top+((i*53)%100)/100*(H-top);cx.beginPath();cx.ellipse(x,y,30,8,0,0,TAU);cx.fill()}
    cx.restore();
    if(eelFish){const f=eelFish;cx.fillStyle='rgba(40,60,70,.25)';cx.beginPath();cx.ellipse(f.x,f.y+H*.08,26,6,0,0,TAU);cx.fill();
      cx.save();cx.translate(f.x,f.y);cx.scale(f.d,1);cx.fillStyle='#e8b24a';cx.beginPath();cx.ellipse(0,0,24,11,0,0,TAU);cx.fill();
      cx.beginPath();cx.moveTo(-20,0);cx.lineTo(-34,-10+Math.sin(t*12)*3);cx.lineTo(-34,10+Math.sin(t*12)*3);cx.fill();
      cx.fillStyle='#2a1a10';cx.beginPath();cx.arc(13,-3,2.5,0,TAU);cx.fill();cx.restore()}
    for(const q of eels){
      cx.fillStyle='rgba(70,55,30,.55)';cx.beginPath();cx.ellipse(q.x,q.y,5*q.s,2*q.s,0,0,TAU);cx.fill();
      const hg=q.h*q.out;if(hg<1.5)continue;

      cx.fillStyle=q.nishiki?'#fff4e6':'#ece4cf';cx.beginPath();cx.ellipse(hx,hy,3.4*q.s,2.6*q.s,0,0,TAU);cx.fill();
      cx.fillStyle='#14100c';cx.beginPath();cx.arc(hx+evt.cur*1.2*q.s,hy-.6*q.s,1.4*q.s,0,TAU);cx.fill();

/* ---- オキアミの大群: a river of countless Antarctic krill flows by; touch it to punch a hole ---- */
let krill=[];
function krillY(x,t,o){return H*.5+Math.sin(x/W*3.2+t*.45)*H*.15+Math.sin(x/W*7.1-t*.8)*H*.035+o*H*(.12+.05*Math.sin(x/W*2+t*.3))}
EV.krill={len:24,lb:['オキアミ','ひき'],bubbles:false,
  start(){
    krill=[];const n=Math.round(Math.min(1000,Math.max(500,W*H/280)));
    for(let i=0;i<n;i++){const o=(Math.random()+Math.random()-1)*1.2,x=-W*.4+Math.random()*W*1.4;
      krill.push({x,o,y:krillY(x,0,o),vx:60,vy:0,ph:Math.random()*6,l:(4.5+Math.random()*3)*vScale(),k:i%2,fl:0})}
    const first=meet('okiami');shimmer();
    showToast('<b>オキアミの大群'+(first?'<br>はじめまして！':'')+'</b>何万びきものナンキョクオキアミ。南極の海では、群れで海の色が変わるほど。ふれると、ざわっと穴があきます',4000);
  },
  step(dt){
    const e=evt,t=e.t,fin=t>e.len-3.5;
    for(const k of krill){
      const ty=krillY(k.x,t,k.o),sp=fin?260:55+25*Math.sin(k.ph*.3);
      k.vx+=(sp-k.vx)*Math.min(1,dt*1.2);k.vy+=((ty-k.y)*1.8-k.vy)*Math.min(1,dt*1.6);
      k.x+=k.vx*dt;k.y+=k.vy*dt;k.ph+=dt*4;if(k.fl>0)k.fl-=dt;
      if(k.x>W+30&&!fin){k.x-=W+80;k.y=krillY(k.x,t,k.o)}
    }
  },
  hit(px,py){
    const R=105*vScale();let n=0;
    for(const k of krill){const dx=k.x-px,dy=k.y-py,d=Math.hypot(dx,dy);if(d>R||d<.01)continue;
      const f=(1-d/R)*560;k.vx+=dx/d*f;k.vy+=dy/d*f;k.fl=1.2;n++}
    if(!n)return false;
    const g=Math.min(6,Math.max(1,Math.round(n/40)));score+=g;evt.n+=n;$('evn').textContent=evt.n;
    pops.push({x:px,y:py-30,life:.9,txt:'ざわっ +'+g,col:'#ffd2c0'});hiss(.14);update();return true;
  },
  draw(t){
    const e=evt,a=evFade(e,1.5,2);if(a<=0)return;
    cx.save();cx.globalAlpha=a;
    cx.fillStyle='rgba(170,215,240,.08)';cx.fillRect(0,0,W,H);
    const P=[new Path2D(),new Path2D()],eyes=new Path2D(),glow=new Path2D();
    for(const k of krill){if(k.x<-10||k.x>W+10)continue;
      const an=Math.atan2(k.vy,k.vx),c=Math.cos(an),s=Math.sin(an),bend=Math.sin(k.ph)*.25,l=k.l;
      const p=P[k.k];p.moveTo(k.x,k.y);p.quadraticCurveTo(k.x-c*l*.5-s*l*bend,k.y-s*l*.5+c*l*bend,k.x-c*l,k.y-s*l);
      eyes.moveTo(k.x+1.1,k.y);eyes.arc(k.x,k.y,1.1*vScale(),0,TAU);
      if(k.fl>0){glow.moveTo(k.x-c*l*.5+3,k.y-s*l*.5);glow.arc(k.x-c*l*.5,k.y-s*l*.5,3*k.fl,0,TAU)}}
    cx.lineCap='round';cx.lineWidth=2*vScale();
    cx.strokeStyle='rgba(255,140,110,.85)';cx.stroke(P[0]);cx.strokeStyle='rgba(255,185,150,.8)';cx.stroke(P[1]);
    cx.fillStyle='#1a0c0c';cx.fill(eyes);
    cx.save();cx.globalCompositeOperation='lighter';cx.fillStyle='rgba(90,220,255,.55)';cx.fill(glow);cx.restore();
    cx.restore();
  },
  end(){krill=[]},
  msg(n){return'<b>'+n+' ひき</b>のオキアミが、ざわっと散りました。大群は南極の海の奥へ流れていきます'}
};

/* ---- 深海の湖 (brine pool): a lake of heavy salty water lies on the sea floor, its shore
   packed with mussels. Creatures that wander onto it go limp and sink; tap them to save them ---- */
let mussels=[],ripples=[],strays=[],lurks=[],murk=[];
function gurgle(){noise(.9,'lowpass',180,.3);setTimeout(()=>noise(.4,'lowpass',260,.2),260)}
function poolGeo(){return{x:W/2,y:H*.77,rx:Math.min(W*.42,300),ry:Math.min(H*.07,56)}}
function inPool(x,y,k){const g=poolGeo();return((x-g.x)/g.rx)**2+((y-g.y)/g.ry)**2<(k||1)}
EV.brine={len:28,lb:['たすけた','ひき'],bubbles:true,
  start(){
    const g=poolGeo(),sc=vScale();mussels=[];ripples=[];strays=[];lurks=[];murk=[];
    const N=Math.round(260*Math.min(1.3,g.rx/220));
    for(let i=0;i<N;i++){const a=Math.random()*TAU,r=1.04+Math.pow(Math.random(),1.6)*.42;
      mussels.push({x:g.x+Math.cos(a)*g.rx*r,y:g.y+Math.sin(a)*g.ry*r*1.25,a:a+Math.PI/2+(Math.random()-.5)*.8,s:(.8+Math.random()*.5)*sc,o:1,shut:-1})}
    mussels.sort((p,q)=>p.y-q.y);
    evt.sT=1.2;evt.mT=1;
    const first=meet('hibari');rumble();
    showToast('<b>深海の湖'+(first?'<br>はじめまして！':'')+'</b>海の底に、とても塩からい水がたまった“湖”。岸にはシンカイヒバリガイがびっしり。近づく生き物にふれると引きかえします。湖に入って動けなくなった生き物も、ふれると助けられます',4800);
  },
  step(dt){
    const e=evt,t=e.t,fin=t>e.len-3,g=poolGeo();
    for(const m of mussels){const tg=t<m.shut?0:1;m.o+=(tg-m.o)*Math.min(1,dt*(tg?2:16))}
    for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=dt*90;r.life-=dt*.5;if(r.life<=0)ripples.splice(i,1)}
    e.mT-=dt;if(e.mT<=0){e.mT=.8+Math.random()*1.2;const m=mussels[Math.floor(Math.random()*mussels.length)];
      if(m)bubbles.push({x:m.x,y:m.y-6,r:5+Math.random()*5,sp:60+Math.random()*30,ph:Math.random()*6,wf:1.4,wa:6,hue:190,pearl:false,glow:false,born:.3})}
    for(let i=lurks.length-1;i>=0;i--){const L=lurks[i];L.t+=dt;if(L.t>L.len)lurks.splice(i,1)}
    for(let i=murk.length-1;i>=0;i--){const b=murk[i];if(b.d>0){b.d-=dt;continue}b.y+=b.vy*dt;b.x+=Math.sin(b.y*.08)*8*dt;b.life-=dt*.45;
      if(b.life<=0){murk.splice(i,1)}}
    e.sT-=dt;
    if(e.sT<=0&&!fin&&strays.length<8){e.sT=1.1+Math.random()*1.3;const d=Math.random()<.5?1:-1;
      strays.push({kind:Math.random()<.6?'fish':'ebi',x:d>0?-50:W+50,y:g.y-g.ry*(.2+Math.random()*.5)-H*.12,d,
        tx:g.x+(Math.random()-.5)*g.rx*.8,ty:g.y+(Math.random()-.5)*g.ry*.5,st:'swim',roll:0,sink:0,a:1,ph:Math.random()*6,s:vScale(),warned:0})}
    for(let i=strays.length-1;i>=0;i--){const s=strays[i];s.ph+=dt;
      if(s.st==='swim'){const dx=s.tx-s.x,dy=s.ty-s.y,dd=Math.hypot(dx,dy)||1,v=fin?160:s.warned?26:55;
        if(!s.warned&&!fin&&inPool(s.x,s.y,3.2)){s.warned=1;
          const lx=Math.max(g.x-g.rx*.75,Math.min(g.x+g.rx*.75,s.tx));
          lurks.push({x:lx,t:0,len:2.8,s:(.8+Math.random()*.4)*vScale()});
          for(let k=0;k<7;k++)murk.push({x:lx+(Math.random()-.5)*g.rx*.35,y:g.y+(Math.random()-.5)*g.ry*.5,r:3+Math.random()*6,vy:-(20+Math.random()*30),life:1,d:k*.12});
          pops.push({x:s.x,y:s.y-34,life:1.2,txt:'あぶない！',col:'#ff9a8a'});gurgle()}
        if(s.warned)s.warned+=dt;
        s.x+=dx/dd*v*dt;s.y+=dy/dd*v*dt;s.d=dx>0?1:-1;
        if(inPool(s.x,s.y,.85)){s.st='stun';s.sink=0;pops.push({x:s.x,y:s.y-26,life:.9,txt:'…!',col:'#cfe2ee'})}}
      if(s.st==='stun'&&!s.sank){s.sank=1;const lx=s.x;for(let k=0;k<5;k++)murk.push({x:lx+(Math.random()-.5)*30,y:s.y,r:2+Math.random()*4,vy:-(25+Math.random()*25),life:1,d:k*.15})}
      if(s.st==='swim'){}else if(s.st==='stun'){s.roll=Math.min(Math.PI*.9,s.roll+dt*.7);s.sink+=dt;s.y+=dt*4;s.a=Math.max(0,1-s.sink/6);
        if(s.a<=0)strays.splice(i,1)}
      else{s.vy+=(-30-s.vy)*Math.min(1,dt*2);s.x+=s.d*190*dt;s.y+=s.vy*dt;s.roll+=(0-s.roll)*Math.min(1,dt*6);
        if(s.x<-80||s.x>W+80)strays.splice(i,1)}
    }
  },
  hit(px,py){
    for(const s of strays){if(s.st!=='swim'||!s.warned)continue;
      if((px-s.x)**2+(py-s.y)**2<=(30*s.s+16)**2){s.st='saved';s.vy=-140;s.d=s.x<poolGeo().x?-1:1;
        score+=2;evt.n++;$('evn').textContent=evt.n;happy();
        pops.push({x:s.x,y:s.y-30,life:1.1,txt:'ひきかえした！ +2',col:'#bff3f0'});update();return true}}
    for(const s of strays){if(s.st!=='stun')continue;
      if((px-s.x)**2+(py-s.y)**2<=(28*s.s+14)**2){s.st='saved';s.vy=-170;s.a=1;s.d=px<W/2?-1:1;
        score+=3;evt.n++;$('evn').textContent=evt.n;happy();
        pops.push({x:s.x,y:s.y-30,life:1.1,txt:'たすけた！ +3',col:'#bff3f0'});update();return true}}
    const t=evt.t;let n=0,near=false;
    for(const m of mussels){const d=Math.hypot(m.x-px,(m.y-py)*1.3);if(d<70){near=true;if(m.o>.5)n++;m.shut=t+.9+Math.random()*.8+d/300}}
    if(near){if(n){const g=Math.max(1,Math.round(n/6));score+=g;pops.push({x:px,y:py-26,life:.8,txt:'パチッ +'+g,col:'#e8d0b8'});noise(.12,'highpass',1800,.15);update()}return true}
    if(inPool(px,py,1)){ripples.push({x:px,y:py,r:4,life:1});chime(392);return true}
    return false;
  },
  draw(t){
    const e=evt,a=evFade(e,1.4,1.8);if(a<=0)return;const g=poolGeo();
    cx.save();cx.globalAlpha=a;seaFloor(.5);
    cx.fillStyle='rgba(40,34,30,.9)';cx.beginPath();cx.ellipse(g.x,g.y+4,g.rx*1.5,g.ry*1.9,0,0,TAU);cx.fill();
    // mussels on the shore
    const shell=new Path2D(),slit=new Path2D(),hl=new Path2D();
    for(const m of mussels){const c=Math.cos(m.a),s=Math.sin(m.a),L=6*m.s,w=3*m.s*(.7+.3*m.o);
      shell.moveTo(m.x+c*L,m.y+s*L);shell.ellipse(m.x,m.y,L,w,m.a,0,TAU);
      hl.moveTo(m.x-s*w*.5+c*L*.6,m.y+c*w*.5+s*L*.6);hl.lineTo(m.x-s*w*.5-c*L*.6,m.y+c*w*.5-s*L*.6);
      if(m.o>.2){slit.moveTo(m.x+c*L*.7,m.y+s*L*.7);slit.lineTo(m.x-c*L*.7,m.y-s*L*.7)}}
    cx.fillStyle='#2b2329';cx.fill(shell);cx.strokeStyle='rgba(150,130,140,.55)';cx.lineWidth=1;cx.stroke(hl);
    cx.strokeStyle='rgba(235,170,120,.8)';cx.lineWidth=1.3;cx.stroke(slit);
    // the lake surface
    cx.save();cx.beginPath();cx.ellipse(g.x,g.y,g.rx,g.ry,0,0,TAU);cx.clip();
    const lg=cx.createLinearGradient(0,g.y-g.ry,0,g.y+g.ry);lg.addColorStop(0,'#7e98aa');lg.addColorStop(.5,'#3c5264');lg.addColorStop(1,'#1c2834');
    cx.fillStyle=lg;cx.fillRect(g.x-g.rx,g.y-g.ry,g.rx*2,g.ry*2);
    cx.strokeStyle='rgba(220,240,250,.18)';cx.lineWidth=1;
    for(let i=0;i<5;i++){const k=((t*.08+i/5)%1);cx.beginPath();cx.ellipse(g.x+Math.sin(t*.3+i)*g.rx*.1,g.y,g.rx*k,g.ry*k,0,0,TAU);cx.stroke()}
    cx.fillStyle='rgba(255,255,255,.12)';cx.beginPath();cx.ellipse(g.x-g.rx*.2,g.y-g.ry*.45,g.rx*.5,g.ry*.12,0,0,TAU);cx.fill();
    for(const r of ripples){cx.strokeStyle=`rgba(230,245,255,${.6*r.life})`;cx.lineWidth=1.5;cx.beginPath();cx.ellipse(r.x,r.y,r.r,r.r*g.ry/g.rx*1.6,0,0,TAU);cx.stroke()}
    cx.restore();
    cx.strokeStyle='rgba(210,230,240,.35)';cx.lineWidth=1.5;cx.beginPath();cx.ellipse(g.x,g.y,g.rx,g.ry,0,0,TAU);cx.stroke();
    // something rises out of the lake to warn them off
    for(const L of lurks){const k=L.t<.6?ease(L.t/.6):L.t>L.len-.7?ease((L.len-L.t)/.7):1,S=34*L.s,sy=g.y+g.ry*.15;
      cx.save();cx.beginPath();cx.rect(L.x-S*2,sy-S*3,S*4,S*3);cx.clip();
      const hy=sy-S*1.25*k+S*.4,sw=Math.sin(L.t*3)*S*.06;
      const hg=cx.createRadialGradient(L.x,hy-S*.3,2,L.x,hy,S*1.2);hg.addColorStop(0,'#3a4658');hg.addColorStop(1,'#141b26');
      cx.fillStyle=hg;cx.beginPath();cx.moveTo(L.x-S*.9+sw,sy+2);cx.bezierCurveTo(L.x-S*1.0,hy-S*.2,L.x-S*.55,hy-S*.95,L.x+sw,hy-S*.95);
      cx.bezierCurveTo(L.x+S*.55,hy-S*.95,L.x+S*1.0,hy-S*.2,L.x+S*.9+sw,sy+2);cx.closePath();cx.fill();
      cx.strokeStyle='rgba(170,200,220,.35)';cx.lineWidth=1.5;cx.stroke();
      const bl=Math.sin(L.t*5)>.92?.15:1;
      cx.save();cx.shadowColor='#d8ff5a';cx.shadowBlur=14;cx.fillStyle='#e8ff7a';
      for(const sd of[-1,1]){cx.beginPath();cx.ellipse(L.x+sd*S*.32+sw,hy-S*.42,S*.15,S*.11*bl,sd*.2,0,TAU);cx.fill()}
      cx.restore();cx.fillStyle='#0a0e14';
      for(const sd of[-1,1]){cx.beginPath();cx.ellipse(L.x+sd*S*.32+sw,hy-S*.42,S*.04,S*.09*bl,0,0,TAU);cx.fill()}
      cx.restore();
      // water sheeting off
      cx.strokeStyle=`rgba(200,225,240,${.5*k})`;cx.lineWidth=1.5;cx.beginPath();cx.ellipse(L.x,sy,S*(1+L.t*.3),S*.2,0,0,TAU);cx.stroke()}
    for(const b of murk){if(b.d>0)continue;cx.globalAlpha=a*Math.min(1,b.life*1.4);
      cx.fillStyle='rgba(150,90,170,.28)';cx.strokeStyle='rgba(200,150,220,.8)';cx.lineWidth=1.2;
      cx.beginPath();cx.arc(b.x,b.y,b.r,0,TAU);cx.fill();cx.stroke();
      cx.fillStyle='rgba(255,255,255,.5)';cx.beginPath();cx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.2,0,TAU);cx.fill()}
    cx.globalAlpha=a;
    // wanderers
    for(const s of strays){cx.save();cx.globalAlpha=a*s.a;cx.translate(s.x,s.y+Math.sin(s.ph*2)*2);cx.scale(s.d*s.s,s.s);cx.rotate(s.roll);
      if(s.kind==='fish'){cx.fillStyle='#9aa2aa';cx.beginPath();cx.moveTo(18,0);cx.quadraticCurveTo(14,-11,0,-9);cx.quadraticCurveTo(-20,-5,-42,0);
        cx.quadraticCurveTo(-20,5,0,9);cx.quadraticCurveTo(14,11,18,0);cx.fill();
        cx.fillStyle='#e8eef2';cx.beginPath();cx.arc(9,-3,3.4,0,TAU);cx.fill();cx.fillStyle='#10161c';cx.beginPath();cx.arc(10,-3,2,0,TAU);cx.fill()}
      else drawShrimp({x:0,y:0,s:9,ph:s.ph,mode:'swim',ang:0,hue:350});
      cx.restore();
      if(s.st==='swim'&&s.warned){const p=.6+.4*Math.sin(s.warned*10);cx.save();cx.globalAlpha=a*p;
        cx.fillStyle='#ff7a6a';cx.font='700 22px "Zen Maru Gothic",sans-serif';cx.textAlign='center';cx.fillText('！',s.x,s.y-24*s.s);cx.restore()}}
    cx.restore();
  },
  end(){mussels=[];ripples=[];strays=[];lurks=[];murk=[]},
  msg(n){return n?'<b>'+n+' ひき</b>を湖から助けました。湖は、また静かに光っています':'<b>深海の湖</b>湖は、また静かに光っています'}
};

/* ---- ヨコエビの大群: bait sinks to the bottom of the trench and countless amphipods swarm it ---- */
let amphis=[],bait=null;
function baitPt(){const b=bait,a=Math.random()*TAU,r=Math.sqrt(Math.random());return[b.x+Math.cos(a)*b.L*.42*r,b.y+Math.sin(a)*b.L*.12*r]}
EV.amphi={len:28,lb:['ヨコエビ','ひき'],bubbles:false,
  start(){
    const L=Math.min(W*.55,260);bait={x:W/2,y:-60,ty:floorY(W/2)-L*.14,vy:0,land:false,eat:0,L};amphis=[];evt.spawn=0;
    const first=meet('yokoebi');
    showToast('<b>ヨコエビの大群'+(first?'<br>はじめまして！':'')+'</b>海溝の底に、えさの魚が沈んできました。においをかぎつけて、小さなヨコエビたちがどこからともなく…。ふれると、ぱっと散ります',4400);
  },
  step(dt){
    const e=evt,b=bait,t=e.t,fin=t>e.len-3.5,sc=vScale();if(!b)return;
    if(!b.land){b.vy=Math.min(160,b.vy+200*dt);b.y+=b.vy*dt;if(b.y>=b.ty){b.y=b.ty;b.land=true;knock();sandPuff(b.x,b.y+b.L*.08)}}
    else if(!fin){e.spawn+=dt*55;const cap=Math.round(Math.min(560,W*H/420));
      while(e.spawn>=1&&amphis.length<cap){e.spawn--;const side=Math.random(),x=side<.4?-10:side<.8?W+10:Math.random()*W,y=side<.8?H*(.45+Math.random()*.5):H+10;
        const [tx,ty]=baitPt();amphis.push({x,y,tx,ty,st:'come',vx:0,vy:0,ph:Math.random()*6,s:(.8+Math.random()*.5)*sc,cd:0,sp:110+Math.random()*80})}}
    let eating=0;
    for(const q of amphis){q.ph+=dt*8;
      if(fin&&q.st!=='leave'){q.st='leave';const a=Math.atan2(q.y-b.y,q.x-b.x);q.vx=Math.cos(a)*220;q.vy=Math.sin(a)*220-60}
      if(q.st==='come'){const dx=q.tx-q.x,dy=q.ty-q.y,d=Math.hypot(dx,dy)||1;q.vx=dx/d*q.sp;q.vy=dy/d*q.sp+Math.sin(q.ph)*30;
        if(d<5){q.st='eat'}}
      else if(q.st==='eat'){q.vx=Math.sin(q.ph*1.3)*12;q.vy=Math.cos(q.ph)*8;eating++}
      else if(q.st==='flee'){q.vx*=1-Math.min(1,dt*2.5);q.vy=q.vy*(1-Math.min(1,dt*2.5))+60*dt;q.cd-=dt;
        if(q.cd<=0){q.st='come';[q.tx,q.ty]=baitPt()}}
      q.x+=q.vx*dt;q.y+=q.vy*dt;
    }
    if(fin)amphis=amphis.filter(q=>q.x>-30&&q.x<W+30&&q.y>-30&&q.y<H+30);
    b.eat=Math.min(1,b.eat+eating*dt/9000);
  },
  hit(px,py){
    const R=95*vScale();let n=0;
    for(const q of amphis){if(q.st==='leave')continue;const dx=q.x-px,dy=q.y-py,d=Math.hypot(dx,dy);if(d>R||d<.01)continue;
      q.st='flee';q.cd=.9+Math.random()*.9;const f=380*(1-d/R)+120;q.vx=dx/d*f;q.vy=dy/d*f-80;n++}
    if(!n)return false;
    const g=Math.min(6,Math.max(1,Math.round(n/12)));score+=g;evt.n+=n;$('evn').textContent=evt.n;
    pops.push({x:px,y:py-30,life:.9,txt:'ぱっ +'+g,col:'#f2e6d2'});hiss(.12);update();return true;
  },
  draw(t){
    const e=evt,a=evFade(e,1.4,2),b=bait;if(a<=0||!b)return;
    cx.save();cx.globalAlpha=a;seaFloor(.62);
    // the bait: a fish that slowly turns into bones
    const L=b.L,x=b.x,y=b.y;
    cx.strokeStyle='#e6dfd0';cx.lineCap='round';cx.lineWidth=Math.max(2,L*.02);
    cx.beginPath();cx.moveTo(x-L*.42,y);cx.lineTo(x+L*.3,y);cx.stroke();
    cx.lineWidth=Math.max(1,L*.01);
    for(let i=0;i<10;i++){const rx=x-L*.32+i*L*.06;cx.beginPath();cx.moveTo(rx,y);cx.quadraticCurveTo(rx-L*.03,y-L*.06,rx-L*.02,y-L*.1);cx.moveTo(rx,y);cx.quadraticCurveTo(rx-L*.03,y+L*.06,rx-L*.02,y+L*.1);cx.stroke()}
    cx.fillStyle='#e6dfd0';cx.beginPath();cx.ellipse(x+L*.36,y,L*.09,L*.08,0,0,TAU);cx.fill();
    cx.fillStyle='#1a1414';cx.beginPath();cx.arc(x+L*.38,y-L*.02,L*.025,0,TAU);cx.fill();
    cx.save();cx.globalAlpha*=1-b.eat*.92;
    const fg=cx.createLinearGradient(0,y-L*.14,0,y+L*.14);fg.addColorStop(0,'#8c9aa8');fg.addColorStop(1,'#d8dee4');
    cx.fillStyle=fg;cx.beginPath();cx.moveTo(x+L*.46,y);cx.quadraticCurveTo(x+L*.3,y-L*.16,x-L*.1,y-L*.13);cx.quadraticCurveTo(x-L*.35,y-L*.08,x-L*.42,y);
    cx.lineTo(x-L*.55,y-L*.1);cx.lineTo(x-L*.53,y);cx.lineTo(x-L*.55,y+L*.1);cx.lineTo(x-L*.42,y);
    cx.quadraticCurveTo(x-L*.35,y+L*.08,x-L*.1,y+L*.13);cx.quadraticCurveTo(x+L*.3,y+L*.16,x+L*.46,y);cx.fill();
    cx.fillStyle='#1a2028';cx.beginPath();cx.arc(x+L*.33,y-L*.03,L*.03,0,TAU);cx.fill();
    cx.restore();
    // the swarm
    const body=new Path2D(),eyes=new Path2D();
    for(const q of amphis){const an=Math.atan2(q.vy,q.vx)+(q.st==='eat'?Math.sin(q.ph)*.6:0),l=3.6*q.s;
      body.moveTo(q.x+Math.cos(an)*l,q.y+Math.sin(an)*l);body.ellipse(q.x,q.y,l,l*.55,an,0,TAU);
      eyes.moveTo(q.x+Math.cos(an)*l*.7+.9,q.y+Math.sin(an)*l*.7);eyes.arc(q.x+Math.cos(an)*l*.7,q.y+Math.sin(an)*l*.7,.9*q.s,0,TAU)}
    cx.fillStyle='#efe0c6';cx.fill(body);cx.strokeStyle='rgba(150,120,90,.5)';cx.lineWidth=.6;cx.stroke(body);
    cx.fillStyle='#120c0a';cx.fill(eyes);
    cx.restore();
  },
  end(){amphis=[];bait=null},
  msg(n){return'<b>'+n+' ひき</b>のヨコエビを散らしました。えさはすっかり骨だけに。ヨコエビたちは、また暗い海溝の底へ'}
};

function chomp(){
  noise(.12,'lowpass',420,.5);
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(160,n);o.frequency.exponentialRampToValueAtTime(80,n+.12);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.2,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.2);
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.25);
}

/* ---- オオタルマワシのゆりかご (4th sea): a big Phronima pushes its see-through barrel.
   Tap the water and she swims there; tap the barrel and it rolls, and her babies tumble
   out. Tap a baby and it swims home into the barrel. ---- */
let phro=null;
function phroS(){return Math.max(70,Math.min(118,Math.min(W,H)*.22))}
EV.phro={len:30,lb:['あかちゃん','ひき'],bubbles:false,
  start(){
    const S=phroS();
    phro={S,x:-S*1.6,y:H*.52,tx:W*.5,ty:H*.52,vx:0,vy:0,dir:1,rot:0,spin:0,hits:0,babies:[],auto:4,inside:14,bob:Math.random()*6,wave:0};
    const first=meet('taru');happy();
    showToast('<b>オオタルマワシのゆりかご'+(first?'<br>はじめまして！':'')+'</b>すき通ったタルは、赤ちゃんを育てるゆりかご。水にふれると、そこへ押していきます。タルにふれると…？',4200);
  },
  step(dt){
    const p=phro,e=evt;if(!p)return;

    if(fin){p.tx=W+p.S*2.2;p.ty=H*.45;for(const b of p.babies)b.home=true}
    // swim toward the target, pushing the barrel ahead
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),sp=fin?260:Math.min(170,d*1.4);
    const ax=d>1?dx/d*sp:0,ay=d>1?dy/d*sp:0;
    p.vx+=(ax-p.vx)*Math.min(1,dt*2.2);p.vy+=(ay-p.vy)*Math.min(1,dt*2.2);
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.bob+=dt;
    if(Math.abs(p.vx)>12)p.dir+=((p.vx>0?1:-1)-p.dir)*Math.min(1,dt*3);

    for(let i=p.babies.length-1;i>=0;i--){const b=p.babies[i];b.ph+=dt;
      if(b.home){const hx=p.x-b.x,hy=p.y-b.y,hd=Math.hypot(hx,hy),s=fin?420:200;
        b.vx+=(hx/(hd||1)*s-b.vx)*Math.min(1,dt*4);b.vy+=(hy/(hd||1)*s-b.vy)*Math.min(1,dt*4);
        if(hd<p.S*.35){p.babies.splice(i,1);p.inside++;
          if(b.saved&&!fin){score+=2;evt.n++;$('evn').textContent=evt.n;pops.push({x:p.x,y:p.y-p.S*.75,life:.9,txt:'おかえり +2',col:'#ffd6dc'});blip();update()}
          continue}}
      else{b.t-=dt;if(b.t<=0){b.t=.8+Math.random()*1.4;const a=Math.random()*TAU;b.wx=Math.cos(a)*40;b.wy=Math.sin(a)*30}
        // stay within a playful distance of mum, and on screen
        const hx=p.x-b.x,hy=p.y-b.y,hd=Math.hypot(hx,hy),pull=hd>p.S*2.6?.9:0;
        b.vx+=(b.wx+hx*pull-b.vx)*Math.min(1,dt*1.5);b.vy+=(b.wy+hy*pull-b.vy)*Math.min(1,dt*1.5);
        if(b.x<20)b.vx+=60*dt*10;if(b.x>W-20)b.vx-=60*dt*10;if(b.y<110)b.vy+=60*dt*10;if(b.y>H-60)b.vy-=60*dt*10;
        b.life-=dt;if(b.life<=0)b.home=true}
      b.x+=b.vx*dt;b.y+=b.vy*dt}
  },
  hit(px,py){
    const p=phro;if(!p||evt.t>evt.len-3.2)return false;
    for(const b of p.babies){if(b.home)continue;const r=b.s*1.4+20;
      if((px-b.x)**2+(py-b.y)**2<=r*r){b.home=true;b.saved=true;pops.push({x:b.x,y:b.y-18,life:.7,txt:'ぴょこ',col:'#ffe0e6'});return true}}
    const dx=(px-p.x)/(p.S*.62+18),dy=(py-p.y)/(p.S*.48+18);
    if(dx*dx+dy*dy<=1){
      p.spin=1;p.hits++;p.wave=.6;score+=1;update();
      pops.push({x:p.x,y:p.y-p.S*.7,life:.9,txt:'ぐるん +1',col:'#c8f4ff'});noise(.25,'bandpass',700,.18);
      if(p.hits%2===0)phroRelease(2+Math.floor(Math.random()*2));
      return true}
    // tap the water: she pushes the cradle over there
    p.tx=Math.max(p.S*.8,Math.min(W-p.S*.8,px));p.ty=Math.max(150,Math.min(H-p.S*.6-80,py));
    bits.push({ring:1,x:px,y:py,r:14,life:1,pearl:false});

  },
  draw(t){
    const p=phro;if(!p)return;const e=evt,a=evFade(e,1,1.2);if(a<=0)return;
    cx.save();cx.globalAlpha=a;
    for(const b of p.babies)drawPhroBaby(b,t);

  end(){phro=null},
  msg(n){return'<b>あかちゃん '+n+' ひき</b>がタルにもどりました。オオタルマワシは、ゆりかごを押して深みへ帰っていきます'}
};
NAMES.phro='オオタルマワシ';
function phroRelease(k){
  const p=phro;if(!p)return;
  for(let i=0;i<k&&p.inside>0&&p.babies.length<12;i++){p.inside--;
    const a=-Math.PI/2+(Math.random()-.5)*2.4,s=70+Math.random()*60;
    p.babies.push({x:p.x+Math.cos(a)*p.S*.3,y:p.y+Math.sin(a)*p.S*.2,vx:Math.cos(a)*s,vy:Math.sin(a)*s,wx:0,wy:0,t:.6,
      ph:Math.random()*6,s:(12+Math.random()*4)*vScale(),life:9+Math.random()*5,home:false,saved:false})}
  if(k>0)blip();
}
function drawPhroBaby(b,t){
  const s=b.s,an=Math.atan2(b.vy,b.vx);
  cx.save();cx.translate(b.x,b.y);cx.rotate(an);
  cx.fillStyle='rgba(255,215,205,.85)';
  for(let i=0;i<4;i++){cx.beginPath();cx.ellipse(-s*(.15+i*.38),Math.sin(b.ph*6+i)*s*.08,s*.32,s*.24,0,0,TAU);cx.fill()}
  cx.strokeStyle='rgba(255,180,165,.8)';cx.lineWidth=Math.max(1,s*.1);cx.lineCap='round';cx.beginPath();
  for(let i=0;i<3;i++){const x=-s*(.1+i*.4),k=Math.sin(b.ph*14+i)*s*.15;cx.moveTo(x,s*.15);cx.lineTo(x-s*.1+k,s*.45)}
  cx.stroke();
  cx.fillStyle='rgba(255,228,220,.95)';cx.beginPath();cx.ellipse(s*.3,0,s*.36,s*.32,0,0,TAU);cx.fill();
  cx.fillStyle='#c0283a';cx.beginPath();cx.ellipse(s*.38,-s*.08,s*.2,s*.16,0,0,TAU);cx.fill();
  cx.fillStyle='rgba(255,255,255,.8)';cx.beginPath();cx.arc(s*.32,-s*.13,s*.06,0,TAU);cx.fill();
  cx.restore();
}
function drawPhro(p,t){
  const S=p.S,bob=Math.sin(p.bob*1.4)*S*.04;
  cx.save();cx.translate(p.x,p.y+bob);
  // a soft glow so she stands out
  const hg=cx.createRadialGradient(0,0,0,0,0,S*1.4);hg.addColorStop(0,'rgba(190,235,255,.14)');hg.addColorStop(1,'rgba(190,235,255,0)');
  cx.fillStyle=hg;cx.beginPath();cx.arc(0,0,S*1.4,0,TAU);cx.fill();
  cx.scale(p.dir>=0?1:-1,1);
  const w=S*1.15,h=S*.82,sq=1+Math.sin(p.wave*20)*.05*p.wave;
  // the barrel (rolls: the ribs slide round)
  cx.save();cx.scale(sq,1/sq);
  cx.fillStyle='rgba(205,238,252,.16)';cx.strokeStyle='rgba(225,247,255,.7)';cx.lineWidth=Math.max(1.5,S*.022);
  rr(-w/2,-h/2,w,h,h*.42);cx.fill();cx.stroke();
  cx.save();rr(-w/2,-h/2,w,h,h*.42);cx.clip();
  cx.strokeStyle='rgba(225,247,255,.28)';cx.lineWidth=Math.max(1,S*.014);
  const off=((p.rot%1)+1)%1;
  for(let i=-1;i<6;i++){const x=-w/2+(i+off)*w/5;cx.beginPath();cx.moveTo(x,-h/2);cx.quadraticCurveTo(x+w*.04,0,x,h/2);cx.stroke()}
  cx.fillStyle='rgba(255,255,255,.18)';cx.beginPath();cx.ellipse(-w*.1,-h*.3,w*.32,h*.06,0,0,TAU);cx.fill();
  cx.restore();
  // the babies still inside, cuddled together
  for(let i=0;i<Math.min(p.inside,14);i++){const gx=-w*.32+(i%7)*w*.09,gy=h*.12+Math.floor(i/7)*h*.14+Math.sin(t*2+i)*S*.01;
    cx.fillStyle='rgba(255,205,195,.55)';cx.beginPath();cx.ellipse(gx,gy,S*.045,S*.035,0,0,TAU);cx.fill();
    cx.fillStyle='rgba(190,40,60,.75)';cx.beginPath();cx.arc(gx+S*.02,gy-S*.012,S*.016,0,TAU);cx.fill()}
  cx.restore();
  // mum, half inside at the back of the barrel, legs gripping the rim
  const mx=w*.04,my=-h*.02;
  cx.fillStyle='rgba(255,200,185,.72)';
  for(let i=0;i<5;i++){cx.beginPath();cx.ellipse(mx-S*.1-i*S*.07,my+S*.06+i*S*.03,S*.085,S*.065,.35,0,TAU);cx.fill()}
  cx.strokeStyle='rgba(255,165,145,.85)';cx.lineWidth=Math.max(1.5,S*.028);cx.lineCap='round';
  const kick=Math.sin(t*7)*S*.03;
  cx.beginPath();
  cx.moveTo(mx+S*.05,my+S*.05);cx.lineTo(w*.5-S*.02,-h*.32+kick);
  cx.moveTo(mx+S*.02,my+S*.1);cx.lineTo(w*.5-S*.02,h*.3-kick);
  for(let i=0;i<3;i++){cx.moveTo(mx-S*.12-i*S*.07,my+S*.1+i*S*.03);cx.lineTo(mx-S*.16-i*S*.07+kick,my+S*.22+i*S*.03)}
  cx.stroke();
  // head with the huge two-part red eyes
  cx.fillStyle='rgba(255,222,210,.9)';cx.beginPath();cx.ellipse(mx+S*.05,my-S*.06,S*.17,S*.19,0,0,TAU);cx.fill();
  cx.fillStyle='#b8253a';cx.beginPath();cx.ellipse(mx+S*.09,my-S*.13,S*.1,S*.08,0,0,TAU);cx.ellipse(mx-S*.02,my-S*.17,S*.08,S*.07,0,0,TAU);cx.fill();
  cx.fillStyle='rgba(255,255,255,.75)';cx.beginPath();cx.arc(mx+S*.06,my-S*.16,S*.025,0,TAU);cx.arc(mx-S*.04,my-S*.2,S*.02,0,TAU);cx.fill();
  cx.restore();
}

/* ---- 光のフィナーレ (5th sea, last event): the sea goes dark, and a giant siphonophore —
   a chain of countless small animals living as one — coils across the whole screen, glowing.
   Touch it and a wave of light runs along it with a note. Near the end, every creature
   met on the five seas rises in a glowing parade, and taps burst into lights. ---- */
let finE=null;
const FIN_NOTES=[262,294,330,392,440,523,587,659,784,880];
function finNote(f,v){
  if(!soundOn||!actx)return;
  const n=actx.currentTime;
  [1,2.01].forEach((m,i)=>{const o=actx.createOscillator(),g=actx.createGain();
    o.type=i?'sine':'triangle';o.frequency.value=f*m;
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime((v||.09)/(i?3:1),n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+1.6);
    o.connect(g).connect(actx.destination);o.start(n);o.stop(n+1.7)});
}
function finHum(){   // the deep, slow drone when the lights go out
  if(!soundOn||!actx)return;
  const n=actx.currentTime;
  [55,82.4].forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.12,n+1.5);g.gain.exponentialRampToValueAtTime(.0001,n+6);
    o.connect(g).connect(actx.destination);o.start(n);o.stop(n+6.2)});
}
function finPath(u,t){   // a slow, wide figure the head of the chain swims along
  return{x:W*.5+Math.sin(u*.9+t*.05)*W*.36+Math.sin(u*2.3)*W*.06,
         y:H*.5+Math.sin(u*1.7+1)*H*.24+Math.cos(u*.6)*H*.04};
}
EV.finale={len:44,lb:['ひかり','回'],bubbles:false,
  start(){
    const N=110;
    finE={N,u:0,trail:[],pulses:[],booms:[],parade:[],pStart:false,sparks:[],dark:0,stars:[]};
    for(let i=0;i<60;i++)finE.stars.push({x:Math.random(),y:Math.random(),s:.5+Math.random()*1.6,ph:Math.random()*6});
    const p0=finPath(0,0);for(let i=0;i<N*3;i++)finE.trail.push({x:p0.x-i*4-W,y:p0.y});
    bubbles.length=0;
    const first=meet('kudakurage');finHum();
    showToast('<b>光のフィナーレ'+(first?'<br>はじめまして！':'')+'</b>いちばん深い海の底で、明かりが消えて…。巨大なダイオウクダクラゲが、光りながらやってきました。ふれてみて',4800);
  },
  step(dt){
    const f=finE,e=evt;if(!f)return;
    const ending=e.t>e.len-3;
    f.dark=Math.min(1,e.t/2.5)*(ending?Math.max(0,(e.len-e.t)/3):1);
    // the head swims along the path; the body follows its trail
    f.u+=dt*(ending?.9:.32);
    const h=finPath(f.u,e.t);if(ending){h.x+=(e.t-(e.len-3))*W*.5}
    f.trail.unshift({x:h.x,y:h.y});if(f.trail.length>f.N*3+2)f.trail.pop();
    for(let i=f.pulses.length-1;i>=0;i--){const p=f.pulses[i];p.r+=dt*38;if(p.r>f.N)f.pulses.splice(i,1)}
    for(let i=f.booms.length-1;i>=0;i--){const b=f.booms[i];b.t+=dt;if(b.t>1.8)f.booms.splice(i,1)}
    for(let i=f.sparks.length-1;i>=0;i--){const s=f.sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.97;s.vy=s.vy*.97+18*dt;s.life-=dt*.6;if(s.life<=0)f.sparks.splice(i,1)}
    // the grand parade of everyone met on the five seas
    if(!f.pStart&&e.t>e.len-17){f.pStart=true;
      let list=ALLC.filter(c=>met.includes(c.id)&&DRAW[c.id]);if(list.length<6)list=ALLC.filter(c=>DRAW[c.id]);
      list=list.slice().sort(()=>Math.random()-.5).slice(0,16);
      list.forEach((c,i)=>f.parade.push({id:c.id,name:c.name,x:W*(.12+((i*.37)%1)*.76),y:H+60+i*70,dir:Math.random()<.5?-1:1,ph:Math.random()*6,hue:(i*47)%360}));
      shimmer();showToast('<b>みんなが集まってきた</b>5つの海で出会った生き物たちが、光の下に集まってきます。どこでもふれると、光がはじけます',4200)}
    for(const q of f.parade){q.ph+=dt;q.y-=dt*(ending?140:62);q.x+=Math.sin(q.ph*.8)*12*dt}
  },
  hit(px,py){
    const f=finE;if(!f||evt.t>evt.len-3)return false;
    let best=-1,bd=1e9;
    for(let i=0;i<f.N;i++){const p=f.trail[i*3];if(!p)break;const d=(p.x-px)**2+(p.y-py)**2;if(d<bd){bd=d;best=i}}
    if(best>=0&&bd<(46*vScale())**2){
      f.pulses.push({i:best,r:0,hue:(evt.t*40+best*3)%360});
      const k=Math.floor((1-best/f.N)*FIN_NOTES.length*.999);finNote(FIN_NOTES[Math.max(0,Math.min(FIN_NOTES.length-1,k))]);
      score+=1;evt.n++;$('evn').textContent=evt.n;update();

    if(f.pStart){   // a burst of light anywhere
      const hue=Math.random()*360;f.booms.push({x:px,y:py,t:0,hue});
      for(let i=0;i<34;i++){const a=i/34*TAU+Math.random()*.2,s=90+Math.random()*120;f.sparks.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,hue:hue+Math.random()*40})}

  },
  draw(t){
    const f=finE;if(!f)return;const e=evt;
    // the lights go out
    cx.fillStyle=`rgba(1,3,10,${.82*f.dark})`;cx.fillRect(0,0,W,H);
    cx.save();cx.globalCompositeOperation='lighter';
    for(const s of f.stars){const b=.3+.7*Math.max(0,Math.sin(t*1.3+s.ph));cx.fillStyle=`rgba(150,220,255,${.35*b*f.dark})`;
      cx.beginPath();cx.arc(s.x*W,s.y*H,s.s,0,TAU);cx.fill()}
    cx.restore();
    // the parade (behind the siphonophore)
    for(const q of f.parade){if(q.y<-90||q.y>H+90)continue;const S=crSize()*.62;
      cx.save();cx.translate(q.x,q.y);
      cx.save();cx.globalCompositeOperation='lighter';
      const g=cx.createRadialGradient(0,0,0,0,0,S*2);g.addColorStop(0,`hsla(${q.hue},90%,70%,.35)`);g.addColorStop(1,`hsla(${q.hue},90%,70%,0)`);
      cx.fillStyle=g;cx.beginPath();cx.arc(0,0,S*2,0,TAU);cx.fill();cx.restore();
      cx.globalAlpha=.95;cx.scale(q.dir,1);DRAW[q.id](S,t,true);cx.restore();
      cx.textAlign='center';cx.font='700 12px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';
      cx.fillStyle='rgba(232,251,250,.8)';cx.fillText(q.name,Math.max(50,Math.min(W-50,q.x)),q.y+S*1.25)}
    // the giant siphonophore
    const tr=f.trail,N=f.N,vs=vScale();
    const glowAt=i=>{let g=0;for(const p of f.pulses){const d=Math.abs(i-p.i)-p.r;if(d>-6&&d<2)g=Math.max(g,1-Math.abs(d+2)/4)}return g};
    cx.save();cx.lineCap='round';

    // hanging threads
    cx.lineWidth=1;
    for(let i=2;i<N;i+=2){const p=tr[i*3];if(!p)break;const sw=Math.sin(t*1.6+i*.5)*6;
      cx.strokeStyle=`hsla(${(190+i*1.5)%360},80%,75%,.22)`;cx.beginPath();cx.moveTo(p.x,p.y);
      cx.quadraticCurveTo(p.x+sw,p.y+14*vs,p.x+sw*1.6,p.y+(26+(i%5)*6)*vs);cx.stroke()}
    cx.globalCompositeOperation='lighter';
    for(let i=N-1;i>=0;i--){const p=tr[i*3];if(!p)continue;
      const wave=.5+.5*Math.sin(t*2.4-i*.22),gl=glowAt(i),hue=(185+i*1.6+t*12)%360;

  msg(n){return'<b>ひかり '+n+' 回</b>5つの海の生き物たちが、光の中で見送ってくれました。…どこかで、探査機の音がします'}
};
