<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>あわあわ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one full-screen water tank; a quiet glass HUD floats at the top. Single deliberate deep-water look. */
:root{
  --deep:#06233a; --mid:#0b4a6b; --shallow:#1b7f95; --glow:#bff3f0;
  --ink:#e8fbfa; --soft:rgba(232,251,250,.62); --glass:rgba(255,255,255,.08);
  --pearl:#ffe6a8; --warm:#ffb27a;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--ink);font-family:var(--round);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#tank{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none}
.count{display:flex;flex-direction:column;gap:2px}
.count .num{font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(191,243,240,.35)}
.count .lbl{font-size:12px;letter-spacing:.12em;color:var(--soft)}
.count .nx{font-size:12px;color:var(--soft);margin-top:4px;font-variant-numeric:tabular-nums}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.depth{font-size:13px;color:var(--soft);font-variant-numeric:tabular-nums;text-align:right;line-height:1.5}
.depth b{color:var(--ink);font-weight:700;font-size:15px}
.meter{width:96px;height:4px;border-radius:2px;background:var(--glass);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--glow);transition:width .4s ease}
.btns{display:flex;gap:8px;pointer-events:auto}
.btn{font:inherit;font-size:13px;color:var(--ink);background:var(--glass);border:1px solid rgba(255,255,255,.14);
  border-radius:999px;padding:6px 12px;cursor:pointer;backdrop-filter:blur(6px)}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
  opacity:0;transition:opacity .9s ease;font-size:15px;color:var(--soft);line-height:1.7;width:min(90vw,340px)}
.toast b{display:block;font-size:26px;color:var(--ink);font-weight:700}
.toast.show{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;
  font-size:13px;color:var(--soft);pointer-events:none;transition:opacity 1.2s}
.ev{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
  display:flex;align-items:center;gap:6px;white-space:nowrap;pointer-events:none;
  font-size:14px;color:var(--ink);background:rgba(4,20,34,.6);border:1px solid rgba(191,243,240,.3);
  border-radius:999px;padding:7px 16px;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
.ev[hidden]{display:none}
.ev b{color:var(--glow);font-size:17px}
.ev .tag{font-size:12px;letter-spacing:.08em;color:var(--deep);background:var(--glow);border-radius:999px;padding:2px 9px;margin-right:4px}
.ev.hot{border-color:rgba(255,178,122,.45)} .ev.hot b{color:var(--warm)} .ev.hot .tag{background:var(--warm)}
</style>
</head>
<body>

<canvas id="tank" aria-label="泡の水槽。泡をタップすると消えます"></canvas>

<div class="hud">
  <div class="count"><span class="num" id="score">0</span><span class="lbl">はじけた泡</span><span class="nx" id="nx">つぎのできごとまで 50</span></div>
  <div class="side">
    <div class="depth">水深 <b id="depth">2</b> m<br><span id="best">きろく 0</span><br><span id="zukan">であった生き物 0 / 8</span></div>
    <div class="meter" aria-hidden="true"><i id="bar"></i></div>
    <div class="btns">
      <button class="btn" id="sound" type="button">音 オフ</button>
      <button class="btn" id="pause" type="button">ひと休み</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="ev" id="ev" hidden><span class="tag" id="evName">熱水の丘</span>のこり <b id="evt">0</b> 秒・<span id="evLbl">エビ</span> <b id="evn">0</b> <span id="evU">ぴき</span></div>
<div class="hint" id="hint">泡にふれると、ぱっと消えます</div>

<script>
(function(){
const cv=document.getElementById('tank'),cx=cv.getContext('2d');
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,DPR;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',size);size();
const TAU=Math.PI*2;

/* ---- levels: every 25 pops we sink deeper ---- */
const PER=25;
let score=0,best=0,paused=false,soundOn=false,actx=null;
try{best=+localStorage.getItem('awa-best')||0}catch(e){}
$('best').textContent='きろく '+best;
function level(){return Math.floor(score/PER)}
function cfg(){
  const L=level();
  return{
    speed:28+L*9,                     // px/s
    rMin:Math.max(14,30-L*1.6),rMax:Math.max(26,58-L*3),
    spawn:Math.max(.22,1.0-L*.085),   // seconds between bubbles
    wobble:10+L*3,
    max:12+L*3,
    pearl:L>=2?.06:0                   // chance of a golden pearl bubble
  };
}
const depthNames=['浅瀬','さんご礁','青の層','光のとどく底','静かな深み','月の届かない海','まっくらな海溝'];

/* ---- deep-sea creatures: from 26 m down, one sometimes appears with a "ボワン" ---- */
const CREA=[
 {id:'menda',name:'メンダコ',from:3,note:'耳のようなヒレを、パタパタさせて泳ぎます'},
 {id:'kurage',name:'クラゲ',from:3,note:'ほのかに光りながら、ただよっています'},
 {id:'anko',name:'チョウチンアンコウ',from:4,note:'頭のちょうちんで、えものをおびきよせます'},
 {id:'gusoku',name:'ダイオウグソクムシ',from:5,note:'何年も食べなくても平気な、深海のだんごむし'},
 {id:'ryugu',name:'リュウグウノツカイ',from:6,note:'めったに会えない、銀色の長い魚'}
];
/* creatures met only during the milestone events */
const EXTRA=['kujira','yakochu','ebi','ika'];
const ZTOTAL=CREA.length+EXTRA.length;
let met=[];try{met=JSON.parse(localStorage.getItem('awa-met')||'[]')}catch(e){}
let cr=null,crT=5,pops=[];
let evt=null,pendingEvt=null,seqI=0,nextAt=50;
function showMet(){$('zukan').textContent='であった生き物 '+met.length+' / '+ZTOTAL}
showMet();
function meet(id){
  if(met.includes(id))return false;
  met.push(id);try{localStorage.setItem('awa-met',JSON.stringify(met))}catch(e){}
  showMet();return true;
}
function crSize(){return Math.max(46,Math.min(72,Math.min(W,H)*.125))}
function crScale(c){const p=Math.min(1,c.age/.6),k=1.9;return 1+(k+1)*Math.pow(p-1,3)+k*Math.pow(p-1,2)}
function spawnCreature(){
  const L=level(),pool=CREA.filter(c=>L>=c.from),fresh=pool.filter(c=>!met.includes(c.id));
  const list=(fresh.length&&Math.random()<.6)?fresh:pool,c=list[Math.floor(Math.random()*list.length)];
  const dir=Math.random()<.5?1:-1,S=crSize();
  cr={c,x:W*(.25+Math.random()*.5),y:H*(.38+Math.random()*.3),dir,S,age:0,life:13,tapped:0,ph:Math.random()*6.28,vx:dir*S*.35};
  bits.push({ring:1,x:cr.x,y:cr.y,r:S*1.1,life:1,pearl:false},{ring:1,x:cr.x,y:cr.y,r:S*.6,life:1,pearl:false});
  for(let i=0;i<12;i++){const a=Math.random()*6.28,s=60+Math.random()*90;bits.push({x:cr.x,y:cr.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.5+Math.random()*3,life:1})}
  pops.push({x:cr.x,y:cr.y-S*1.3,life:1,txt:'ボワン'});
  bwoon();
}
function bwoon(){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(230,n);o.frequency.exponentialRampToValueAtTime(70,n+.55);
  l.frequency.value=14;lg.gain.value=20;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.3,n+.03);g.gain.exponentialRampToValueAtTime(.0001,n+.7);
  o.connect(g).connect(actx.destination);o.start(n);l.start(n);o.stop(n+.75);l.stop(n+.75);
}
function happy(){
  if(!soundOn||!actx)return;
  [523.25,783.99].forEach((f,i)=>{const n=actx.currentTime+i*.12,o=actx.createOscillator(),g=actx.createGain();
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.14,n+.01);
    g.gain.exponentialRampToValueAtTime(.0001,n+.35);o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.4)});
}
function hitCreature(px,py){
  if(!cr||cr.tapped)return false;
  const sc=Math.max(.3,crScale(cr)),w=cr.c.id==='ryugu'?2.2:1.05;
  const dx=(px-cr.x)/(cr.S*w*sc+14),dy=(py-cr.y)/(cr.S*.9*sc+14);
  if(dx*dx+dy*dy>1)return false;
  cr.tapped=.001;score+=3;happy();
  const first=meet(cr.c.id);
  pops.push({x:cr.x,y:cr.y-cr.S*1.3,life:1,txt:'+3'});
  update();
  showToast('<b>'+cr.c.name+(first?'<br>はじめまして！':'')+'</b>'+cr.c.note,3400);
  return true;
}
function stepCreature(dt){
  const L=level();
  if(!cr){
    if(L>=3&&dt>0&&!evt){crT-=dt;if(crT<=0){spawnCreature();crT=Math.max(9,22-(L-3)*3)+Math.random()*12}}
    return;
  }
  cr.age+=dt;cr.ph+=dt;
  if(cr.tapped){cr.tapped+=dt;if(cr.tapped>1.4)cr.vx+=cr.dir*cr.S*4*dt}
  cr.x+=cr.vx*dt;cr.y+=Math.sin(cr.ph*1.3)*cr.S*.25*dt;
  if(cr.age>cr.life||cr.x<-cr.S*4||cr.x>W+cr.S*4)cr=null;
}
function eye(x,y,r,t,h){
  cx.strokeStyle='#1a1020';cx.lineCap='round';
  if(h){cx.lineWidth=r*.55;cx.beginPath();cx.arc(x,y+r*.4,r*.85,Math.PI*1.15,Math.PI*1.85);cx.stroke();return}
  if(Math.sin(t*1.3+x*.1)>.985){cx.lineWidth=r*.45;cx.beginPath();cx.moveTo(x-r,y);cx.lineTo(x+r,y);cx.stroke();return}
  cx.fillStyle='#1a1020';cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill();
  cx.fillStyle='#fff';cx.beginPath();cx.arc(x-r*.3,y-r*.35,r*.36,0,6.28);cx.fill();
}
const DRAW={
  menda(S,t,h){
    const flap=Math.sin(t*5)*.35;
    cx.fillStyle='#ff9fb3';
    for(const sx of[-1,1]){cx.save();cx.translate(sx*S*.45,-S*.45);cx.rotate(sx*(.5+flap));
      cx.beginPath();cx.ellipse(0,-S*.18,S*.16,S*.28,0,0,6.28);cx.fill();cx.restore()}
    cx.fillStyle='#ee7393';cx.beginPath();cx.moveTo(-S,0);
    for(let i=0;i<8;i++){const x=-S+i*S/4;cx.quadraticCurveTo(x+S/8,S*.45+Math.sin(t*3+i)*S*.05,x+S/4,S*.1)}
    cx.lineTo(S,0);cx.fill();
    const g=cx.createRadialGradient(-S*.2,-S*.3,S*.1,0,0,S);g.addColorStop(0,'#ffd6e0');g.addColorStop(1,'#ff7f9c');
    cx.fillStyle=g;cx.beginPath();cx.ellipse(0,-S*.02,S,S*.58,0,0,6.28);cx.fill();
    cx.fillStyle='rgba(255,120,150,.6)';cx.beginPath();cx.arc(-S*.48,S*.08,S*.09,0,6.28);cx.arc(S*.48,S*.08,S*.09,0,6.28);cx.fill();
    eye(-S*.3,-S*.1,S*.09,t,h);eye(S*.3,-S*.1,S*.09,t,h);
  },
  kurage(S,t,h){
    cx.save();cx.shadowColor='#8ff7ff';cx.shadowBlur=22;
    cx.strokeStyle='rgba(160,240,255,.75)';cx.lineWidth=2;
    for(let i=0;i<6;i++){const x0=-S*.6+i*S*.24;cx.beginPath();cx.moveTo(x0,0);
      for(let k=1;k<=6;k++)cx.lineTo(x0+Math.sin(t*3+i+k*.8)*S*.1,k*S*.22);cx.stroke()}
    const pulse=1+Math.sin(t*3)*.06;
    const g=cx.createRadialGradient(0,-S*.3,S*.05,0,-S*.1,S);g.addColorStop(0,'rgba(225,255,255,.95)');g.addColorStop(1,'rgba(110,220,255,.5)');
    cx.fillStyle=g;cx.beginPath();cx.ellipse(0,0,S*.75*pulse,S*.65/pulse,0,Math.PI,0);cx.closePath();cx.fill();
    cx.restore();
    eye(-S*.22,-S*.22,S*.07,t,h);eye(S*.22,-S*.22,S*.07,t,h);
  },
  anko(S,t,h){
    const sw=Math.sin(t*6)*S*.08;
    cx.fillStyle='#3a2c63';cx.beginPath();cx.moveTo(-S*.75,0);cx.lineTo(-S*1.35,-S*.4+sw);cx.lineTo(-S*1.35,S*.4+sw);cx.fill();
    const g=cx.createRadialGradient(-S*.2,-S*.3,S*.1,0,0,S);g.addColorStop(0,'#7462b8');g.addColorStop(1,'#2e2352');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,S*.85,0,6.28);cx.fill();
    cx.strokeStyle='rgba(180,200,255,.4)';cx.lineWidth=1.5;cx.stroke();
    const open=h?.42:.22+Math.sin(t*2)*.07;
    const U=[S*.84,-S*.04],B=[S*.15,S*.2],D=[S*.78,S*(.2+open)];
    cx.fillStyle='#120a24';cx.beginPath();cx.moveTo(U[0],U[1]);cx.lineTo(B[0],B[1]);cx.lineTo(D[0],D[1]);cx.closePath();cx.fill();
    cx.fillStyle='#f4f0ff';
    for(let i=0;i<4;i++){const f=.3+i*.17;
      const ux=B[0]+(U[0]-B[0])*f,uy=B[1]+(U[1]-B[1])*f;cx.beginPath();cx.moveTo(ux-S*.04,uy);cx.lineTo(ux+S*.04,uy);cx.lineTo(ux,uy+S*.1);cx.fill();
      const lx=B[0]+(D[0]-B[0])*f,ly=B[1]+(D[1]-B[1])*f;cx.beginPath();cx.moveTo(lx-S*.04,ly);cx.lineTo(lx+S*.04,ly);cx.lineTo(lx,ly-S*.1);cx.fill()}
    eye(S*.25,-S*.35,S*.11,t,h);
    const lx2=S*.75+Math.sin(t*2)*S*.08,ly2=-S*1.3;
    cx.strokeStyle='#6a58a8';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(S*.1,-S*.8);cx.quadraticCurveTo(S*.2,-S*1.55,lx2,ly2);cx.stroke();
    cx.save();cx.shadowColor='#fff3a0';cx.shadowBlur=25+Math.sin(t*4)*10;cx.fillStyle='#fff6b8';
    cx.beginPath();cx.arc(lx2,ly2,S*.13,0,6.28);cx.fill();cx.restore();
  },
  gusoku(S,t,h){
    cx.strokeStyle='#8c84a8';cx.lineWidth=2;cx.lineCap='round';
    for(let i=0;i<7;i++){const x=-S*.75+i*S*.25,w=Math.sin(t*8+i)*S*.05;cx.beginPath();cx.moveTo(x,S*.3);cx.lineTo(x+w-S*.05,S*.52);cx.stroke()}
    cx.fillStyle='#a69ec4';
    for(let k=-2;k<=2;k++){cx.beginPath();cx.ellipse(-S*1.08,k*S*.1,S*.16,S*.06,k*.25,0,6.28);cx.fill()}
    const g=cx.createLinearGradient(0,-S*.45,0,S*.4);g.addColorStop(0,'#e2dcf3');g.addColorStop(1,'#8f87b0');
    cx.fillStyle=g;cx.beginPath();cx.ellipse(0,0,S*1.05,S*.42,0,0,6.28);cx.fill();
    cx.strokeStyle='rgba(70,60,100,.5)';cx.lineWidth=1.5;
    for(let i=1;i<7;i++){const x=-S*.85+i*S*.24;cx.beginPath();cx.moveTo(x,-S*.38);cx.quadraticCurveTo(x-S*.07,0,x,S*.38);cx.stroke()}
    cx.strokeStyle='#8f87b0';cx.lineWidth=2;
    for(const k of[-1,1]){cx.beginPath();cx.moveTo(S*.95,-S*.1);
      cx.quadraticCurveTo(S*1.3,-S*.3+k*S*.1,S*1.5,-S*.3+k*S*.2+Math.sin(t*4+k)*S*.06);cx.stroke()}
    eye(S*.72,-S*.13,S*.1,t,h);
  },
  ryugu(S,t,h){
    const N=24,L=S*2.2,pts=[];
    for(let i=0;i<=N;i++){const f=i/N;pts.push([L-f*2*L,Math.sin(t*3-f*7)*S*.2*f,f])}
    const th=f=>S*.2*(1-f*.8);
    const g=cx.createLinearGradient(0,-S*.3,0,S*.3);g.addColorStop(0,'#f4f8ff');g.addColorStop(1,'#9fb3cc');
    cx.fillStyle=g;cx.beginPath();
    pts.forEach(([x,y,f],i)=>i?cx.lineTo(x,y-th(f)):cx.moveTo(x,y-th(f)));
    for(let i=N;i>=0;i--){const [x,y,f]=pts[i];cx.lineTo(x,y+th(f))}
    cx.closePath();cx.fill();
    cx.strokeStyle='#ff5a6e';cx.lineWidth=2;cx.lineCap='round';
    for(let i=2;i<N;i++){const [x,y,f]=pts[i];cx.beginPath();cx.moveTo(x,y-th(f));cx.lineTo(x-S*.05,y-th(f)-S*.18*(1-f*.5));cx.stroke()}
    cx.fillStyle='#ff5a6e';
    for(let k=0;k<4;k++){cx.beginPath();cx.ellipse(L-S*.3-k*S*.1,-S*.38-k*S*.12,S*.05,S*.22,-.4-k*.12,0,6.28);cx.fill()}
    eye(L-S*.28,-S*.03,S*.07,t,h);
  }
};
function drawCreature(t){
  if(!cr)return;
  const c=cr,S=c.S,sc=crScale(c),a=Math.max(0,Math.min(1,(c.life-c.age)/1.5));
  const wig=c.tapped&&c.tapped<1.4?Math.sin(c.tapped*22)*.18:0;
  cx.save();cx.globalAlpha=a;cx.translate(c.x,c.y);cx.rotate(wig);cx.scale(sc*c.dir,sc);
  const hg=cx.createRadialGradient(0,0,0,0,0,S*1.9);hg.addColorStop(0,'rgba(170,240,255,.2)');hg.addColorStop(1,'rgba(170,240,255,0)');
  cx.fillStyle=hg;cx.beginPath();cx.arc(0,0,S*1.9,0,6.28);cx.fill();
  DRAW[c.c.id](S,t,!!c.tapped);
  cx.restore();
}
function drawPops(dt){
  cx.textAlign='center';cx.font='700 22px "Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif';
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life-=dt*.7;p.y-=24*dt;
    if(p.life<=0){pops.splice(i,1);continue}
    cx.globalAlpha=Math.min(1,p.life*1.5);cx.fillStyle=p.col||'#e8fbfa';cx.fillText(p.txt,p.x,p.y)}
  cx.globalAlpha=1;
}

/* ---- bubbles ---- */
let bubbles=[],bits=[],motes=[],t0=performance.now(),spawnT=0;
function spawn(){
  const c=cfg(),glowing=!!(evt&&evt.kind==='glow');
  if(bubbles.length>=c.max+(glowing?8:0))return;
  const r=c.rMin+Math.random()*(c.rMax-c.rMin);
  bubbles.push({x:r+Math.random()*(W-2*r),y:H+r+10,r,
    sp:c.speed*(.7+Math.random()*.6)*(40/r)**.35,
    ph:Math.random()*6.28,wf:.6+Math.random()*.9,wa:c.wobble*(.5+Math.random()),
    hue:glowing?150+Math.random()*170:185+Math.random()*30,pearl:!glowing&&Math.random()<c.pearl,glow:glowing,born:0});
}
for(let i=0;i<40;i++)motes.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.4,v:.004+Math.random()*.01});
// a few bubbles already on screen so the first frame isn't empty
for(let i=0;i<7;i++){spawn();const b=bubbles[bubbles.length-1];b.y=H*(.3+Math.random()*.7);b.born=1}

/* ---- sound: soft "pop" via Web Audio ---- */
function pop(pearl){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';const f=pearl?880:420+Math.random()*260;
  o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*2.2,n+.07);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(pearl?.18:.12,n+.01);
  g.gain.exponentialRampToValueAtTime(.0001,n+(pearl?.5:.16));
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.6);
}
function noise(len,type,freq,vol){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,buf=actx.createBuffer(1,Math.floor(actx.sampleRate*len),actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=buf;f.type=type;f.frequency.value=freq;g.gain.value=vol;
  s.connect(f).connect(g).connect(actx.destination);s.start(n);
}
function rumble(){noise(1.4,'lowpass',260,.35)}            // hot water bursting out
function spray(){noise(.7,'bandpass',1400,.25)}            // whale blowhole
function blip(){                                             // shrimp hop
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),f=1100+Math.random()*500;
  o.type='sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.8,n+.06);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.1,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+.12);
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.15);
}
function whaleSong(){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain(),l=actx.createOscillator(),lg=actx.createGain();
  o.type='sine';o.frequency.setValueAtTime(170,n);o.frequency.linearRampToValueAtTime(290,n+1.1);o.frequency.linearRampToValueAtTime(140,n+2.4);
  l.frequency.value=5;lg.gain.value=6;l.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.14,n+.4);g.gain.exponentialRampToValueAtTime(.0001,n+2.6);
  o.connect(g).connect(actx.destination);o.start(n);l.start(n);o.stop(n+2.7);l.stop(n+2.7);
}
function shimmer(){
  if(!soundOn||!actx)return;
  [880,1108.7,1318.5,1760].forEach((f,i)=>{const n=actx.currentTime+i*.09,o=actx.createOscillator(),g=actx.createGain();
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.07,n+.02);
    g.gain.exponentialRampToValueAtTime(.0001,n+1.2);o.connect(g).connect(actx.destination);o.start(n);o.stop(n+1.3)});
}
$('sound').onclick=e=>{
  e.stopPropagation();soundOn=!soundOn;
  if(soundOn&&!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}

$('pause').onclick=e=>{

/* =====================================================================
   Milestone events — something happens on every multiple of 50.
   They always come in this order (none can be skipped, even if a lot of
   points are scored during an event); after one ends, the next waits for
   the next round number at least 20 points away.
   ===================================================================== */
const MS=50;
const SEQ=['whale','vent','glow','squid','vent','treasure'];
const NAMES={vent:'熱水の丘',whale:'クジラ',glow:'夜光の海',squid:'巨大イカの影',treasure:'海底の宝箱'};
let shrimps=[],plume=[],plank=[],whale=null;
function ease(x){x=Math.max(0,Math.min(1,x));return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2}

function startEvent(kind){
  evt={kind,t:0,n:0,len:{vent:24,squid:20,treasure:22}[kind]||16,arrived:false,ending:false,hp:0,shown:-1};
  const ev=$('ev');ev.classList.toggle('hot',kind==='vent'||kind==='treasure');
  $('evName').textContent=NAMES[kind];
  const LB={vent:['エビ','ぴき'],squid:['タッチ','回'],treasure:['たから','こ']}[kind]||['泡','こ'];
  $('evLbl').textContent=LB[0];$('evU').textContent=LB[1];
  $('evn').textContent=0;ev.hidden=false;
  if(kind==='vent'){
    showToast('<b>スーッ…</b>海の底のさらに下へ、沈んでいきます',2400);rumble();
    VENTS.forEach(v=>{v.cd=0;v.et=1+Math.random();v.bt=Math.random()});
  }else if(kind==='whale'){
    const L=Math.min(W*1.05,560),dir=Math.random()<.5?1:-1;
    whale={L,dir,x:dir>0?-L*.6:W+L*.6,y:H*.6,v:(W+L*1.2)/(evt.len-1.5),bt:.5,cd:0,happy:0};
    const first=meet('kujira');whaleSong();
    showToast('<b>クジラが来た'+(first?'<br>はじめまして！':'')+'</b>大きな息の泡をはじこう。クジラにふれると、しおふき',3200);
  }else if(kind==='squid'){
    startSquid();const first=meet('ika');bwoon();
    showToast('<b>巨大イカの影'+(first?'<br>はじめまして！':'')+'</b>深みから大きな影が…。のびてくる腕にふれると、するっと引っこみます',3600);
  }else if(kind==='treasure'){
    startTreasure();
    showToast('<b>海底の宝箱</b>宝箱が沈んできました。'+NEED+' 回たたくと、ひらきます',3200);
  }else{
    const first=meet('yakochu');shimmer();
    showToast('<b>夜光の海'+(first?'<br>はじめまして！':'')+'</b>小さな夜光虫が光りはじめました。光る泡は 2 点',3200);
  }
  update();
}
function endEvent(){
  const k=evt.kind,n=evt.n;evt=null;whale=null;squid=null;chest=null;
  $('ev').hidden=true;nextAt=Math.ceil((score+20)/MS)*MS;spawnT=.4;
  for(const s of shrimps)if(s.mode!=='flip')flee(s);
  const msg={whale:'<b>'+n+' こ</b>クジラの泡をはじきました',glow:'<b>'+n+' こ</b>光る泡をはじきました',
    squid:'<b>'+n+' 回</b>イカの腕にふれました。影はゆっくり深みへ',
    treasure:'<b>たから '+n+' こ</b>これまでに集めたたから '+takara+' こ'}[k];
  if(msg)showToast(msg,3000);
  happy();update();
}
function stepEvent(dt){
  if(pendingEvt&&!evt){pendingEvt.wait-=dt;if(pendingEvt.wait<=0){const k=pendingEvt.kind;pendingEvt=null;startEvent(k)}}
  if(!evt)return;
  evt.t+=dt;
  const left=Math.max(0,Math.ceil(evt.len-evt.t));
  if(left!==evt.shown){evt.shown=left;$('evt').textContent=left}
  if(evt.kind==='vent')stepVent(dt);
  else if(evt.kind==='whale')stepWhale(dt);
  else if(evt.kind==='squid')stepSquid(dt);
  else if(evt.kind==='treasure')stepTreasure(dt);
  else stepGlow(dt);
  if(evt&&evt.t>=evt.len)endEvent();
}

/* ---- 熱水の丘: hydrothermal vents and lots of shrimp ---- */
const SINK=2.8,RISE=2.6;
const VENTS=[{fx:.2,hf:.62,w:26},{fx:.53,hf:1,w:34},{fx:.83,hf:.72,w:24}].map(v=>{
  v.jl=Array.from({length:9},()=>Math.random()-.5);v.jr=Array.from({length:9},()=>Math.random()-.5);
  v.cd=0;v.et=0;v.bt=0;return v});
function vOff(){return(1-(evt&&evt.kind==='vent'?evt.hp:0))*H*.55}
function hillY(x,off){return H*.78-(Math.sin(x/W*3.1+.4)*.05+Math.sin(x/W*7.3+1)*.015)*H+off}
function vScale(){return Math.max(.85,Math.min(1.3,Math.min(W,H)/420))}
function ventGeo(v){
  const off=vOff(),x=v.fx*W,base=hillY(x,off)+8,ch=v.hf*Math.min(H*.3,230),w=v.w*vScale();
  return{x,base,top:base-ch,ch,w};
}
function spawnShrimp(v,burst){
  const g=ventGeo(v),sc=vScale();
  shrimps.push({x:g.x+(Math.random()-.5)*g.w*.5,y:g.top,vx:(Math.random()-.5)*(burst?300:150),vy:-(170+Math.random()*(burst?280:170)),
    s:(8+Math.random()*5)*sc,hue:340+Math.random()*35,mode:'jump',ph:Math.random()*6,tx:0,ty:0,spin:0,ang:-1.57});
}
function ventBubble(v){
  const g=ventGeo(v),r=10+Math.random()*9;
  bubbles.push({x:g.x+(Math.random()-.5)*g.w*.4,y:g.top-r,r,sp:120+Math.random()*70,ph:Math.random()*6.28,wf:1.4,wa:8,
    hue:18+Math.random()*22,pearl:false,glow:false,born:.3});
}
function erupt(v,n){
  const g=ventGeo(v);
  for(let i=0;i<n;i++)if(shrimps.length<70)spawnShrimp(v,true);
  for(let i=0;i<5;i++)ventBubble(v);
  for(let i=0;i<22;i++)plume.push({x:g.x+(Math.random()-.5)*g.w*.5,y:g.top,vx:(Math.random()-.5)*90,vy:-(90+Math.random()*130),r:g.w*.35,life:1.2});
  pops.push({x:g.x,y:g.top-24,life:1,txt:'ぶわっ',col:'#ffcf9e'});
  rumble();
}
function stepVent(dt){
  const e=evt,t=e.t;
  const hp=t<SINK?ease(t/SINK):t>e.len-RISE?1-ease((t-(e.len-RISE))/RISE):1;
  const shift=(hp-e.hp)*H*.55;e.hp=hp;
  if(shift){   // everything floats past as we sink (or rise)
    for(const b of bubbles)b.y-=shift;
    for(const m of motes){m.y-=shift/H;if(m.y<0)m.y+=1;if(m.y>1)m.y-=1}
    if(cr)cr.y-=shift;
    for(const p of bits)p.y-=shift;
  }
  if(!e.arrived&&t>=SINK){
    e.arrived=true;const first=meet('ebi');
    showToast('<b>熱水の丘に到着</b>地の底から熱いお湯がわき出し、エビたちがあふれ出てきました。エビや煙突にふれてみて'+(first?'<br>（図鑑に「熱水のエビ」が加わりました）':''),3600);
    VENTS.forEach(v=>erupt(v,10));
  }
  if(e.arrived&&!e.ending){
    for(const v of VENTS){
      v.cd-=dt;v.et-=dt;v.bt-=dt;
      if(v.et<=0){v.et=.3+Math.random()*.6;if(shrimps.length<55)spawnShrimp(v,false)}
      if(v.bt<=0){v.bt=.6+Math.random()*1.1;ventBubble(v)}
    }
  }
  if(!e.ending&&t>=e.len-RISE){
    e.ending=true;
    for(const s of shrimps)if(s.mode!=='flip')flee(s);
    showToast('<b>エビ '+e.n+' ぴき</b>と遊びました。ゆっくり浮かびあがります',3000);
  }
  // hot shimmering water
  if(hp>0)for(const v of VENTS){if(Math.random()<dt*22){const g=ventGeo(v);
    plume.push({x:g.x+(Math.random()-.5)*g.w*.4,y:g.top,vx:(Math.random()-.5)*14,vy:-(45+Math.random()*45),r:g.w*.3,life:1})}}
}
function flee(s){s.mode='flee';const a=-Math.PI/2+(Math.random()-.5)*2.6;s.vx=Math.cos(a)*300;s.vy=Math.sin(a)*300}
function pickTarget(s){s.tx=W*(.06+Math.random()*.88);s.ty=H*(.22+Math.random()*.55)}
function angDiff(a,b){return((a-b+Math.PI*3)%TAU)-Math.PI}
function stepShrimps(dt){
  for(let i=shrimps.length-1;i>=0;i--){const s=shrimps[i];s.ph+=dt;
    if(s.mode==='jump'){s.vy+=230*dt;s.vx*=.985;if(s.vy>-25){s.mode='swim';pickTarget(s)}}
    else if(s.mode==='swim'){
      const dx=s.tx-s.x,dy=s.ty-s.y,d=Math.hypot(dx,dy)||1,sp=75+Math.sin(s.ph*2.3)*30;
      s.vx+=(dx/d*sp-s.vx)*Math.min(1,dt*1.6);s.vy+=(dy/d*sp-s.vy)*Math.min(1,dt*1.6);
      if(d<30||Math.random()<dt*.2)pickTarget(s);
    }
    else if(s.mode==='flip'){s.spin+=dt;s.vy+=260*dt;if(s.spin>.7)flee(s)}
    else{s.vx*=1+dt;s.vy*=1+dt}
    s.x+=s.vx*dt;s.y+=s.vy*dt;
    if(s.mode!=='flip')s.ang+=angDiff(Math.atan2(s.vy,s.vx),s.ang)*Math.min(1,dt*7);
    if(s.x<-80||s.x>W+80||s.y<-80||s.y>H+80){if(s.mode!=='swim')shrimps.splice(i,1);else pickTarget(s)}
  }
}
function hitShrimp(px,py){
  if(!evt||evt.kind!=='vent'||!evt.arrived||evt.ending)return false;
  for(let i=shrimps.length-1;i>=0;i--){const s=shrimps[i];
    if(s.mode==='flip'||s.mode==='flee')continue;
    const dx=px-s.x,dy=py-s.y,r=s.s*1.7+14;
    if(dx*dx+dy*dy<=r*r){
      s.mode='flip';s.spin=0;s.vy=-240;s.vx*=.3;s.flipDir=Math.cos(s.ang)>=0?-1:1;
      score+=1;evt.n++;$('evn').textContent=evt.n;blip();
      for(let k=0;k<8;k++){const a=Math.random()*TAU,v=40+Math.random()*80;bits.push({x:s.x,y:s.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*2,life:.8,col:'#ffd0dc'})}
      pops.push({x:s.x,y:s.y-22,life:.8,txt:'ピョン',col:'#ffd0dc'});
      update();return true;
    }
  }
  return false;
}
function hitChimney(px,py){
  if(!evt||evt.kind!=='vent'||!evt.arrived||evt.ending)return false;
  for(const v of VENTS){const g=ventGeo(v);
    if(Math.abs(px-g.x)<=g.w*.8+10&&py>=g.top-40&&py<=g.base){
      if(v.cd<=0){v.cd=1.1;erupt(v,9)}
      return true;
    }
  }
  return false;
}
function drawVent(t){
  if(!evt||evt.kind!=='vent'||evt.hp<=0)return;
  const hp=evt.hp,off=vOff();
  cx.fillStyle=`rgba(2,6,14,${.4*hp})`;cx.fillRect(0,0,W,H);
  const gg=cx.createRadialGradient(W*.53,H*.8+off,0,W*.53,H*.8+off,Math.max(W,H)*.65);
  gg.addColorStop(0,`rgba(255,130,60,${.2*hp})`);gg.addColorStop(1,'rgba(255,130,60,0)');
  cx.fillStyle=gg;cx.fillRect(0,0,W,H);
  // the hill
  const hg=cx.createLinearGradient(0,H*.65+off,0,H+off);hg.addColorStop(0,'#2b2129');hg.addColorStop(1,'#0b080c');
  cx.fillStyle=hg;cx.beginPath();cx.moveTo(0,H+off+5);
  for(let x=0;x<=W+10;x+=10)cx.lineTo(x,hillY(x,off));
  cx.lineTo(W,H+off+5);cx.closePath();cx.fill();
  cx.strokeStyle='rgba(255,160,110,.25)';cx.lineWidth=1.5;cx.beginPath();
  for(let x=0;x<=W+10;x+=10)x?cx.lineTo(x,hillY(x,off)):cx.moveTo(x,hillY(x,off));cx.stroke();
  // white bacteria mats along the ridge
  cx.fillStyle='rgba(240,240,225,.35)';
  for(let i=0;i<26;i++){const x=(i*97.3%1000)/1000*W,y=hillY(x,off)+4+(i*13%9);cx.beginPath();cx.ellipse(x,y,6+(i%4)*3,2,0,0,TAU);cx.fill()}
  // chimneys
  for(const v of VENTS){const g=ventGeo(v),N=8;
    const cg=cx.createLinearGradient(g.x-g.w,0,g.x+g.w,0);cg.addColorStop(0,'#181216');cg.addColorStop(.5,'#3a2a2c');cg.addColorStop(1,'#120d10');
    cx.fillStyle=cg;cx.beginPath();
    for(let k=0;k<=N;k++){const f=k/N,y=g.base-g.ch*f,hw=g.w*(.62-f*.24)+v.jl[k]*g.w*.18;cx.lineTo(g.x-hw,y)}
    for(let k=N;k>=0;k--){const f=k/N,y=g.base-g.ch*f,hw=g.w*(.62-f*.24)+v.jr[k]*g.w*.18;cx.lineTo(g.x+hw,y)}
    cx.closePath();cx.fill();
    cx.fillStyle='rgba(240,235,215,.28)';
    for(let k=1;k<N;k+=2){cx.beginPath();cx.ellipse(g.x+v.jl[k]*g.w*.3,g.base-g.ch*k/N,3,1.5,0,0,TAU);cx.fill()}
    const tg=cx.createRadialGradient(g.x,g.top,0,g.x,g.top,g.w*1.4);
    tg.addColorStop(0,`rgba(255,190,110,${(.7+.2*Math.sin(t*5+v.fx*9))*hp})`);tg.addColorStop(1,'rgba(255,120,60,0)');
    cx.fillStyle=tg;cx.beginPath();cx.arc(g.x,g.top,g.w*1.4,0,TAU);cx.fill();
  }
}
function stepPlume(dt){
  for(let i=plume.length-1;i>=0;i--){const p=plume[i];p.life-=dt*.5;p.x+=p.vx*dt+Math.sin(p.y*.04)*12*dt;p.y+=p.vy*dt;p.vx*=.98;p.r+=dt*16;
    if(p.life<=0)plume.splice(i,1)}
}
function drawPlume(){
  if(!plume.length)return;
  cx.save();cx.globalCompositeOperation='lighter';
  for(const p of plume){const a=Math.max(0,Math.min(1,p.life));
    cx.fillStyle=`rgba(255,165,110,${.07*a})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,TAU);cx.fill();
    cx.fillStyle=`rgba(255,235,210,${.05*a})`;cx.beginPath();cx.arc(p.x,p.y,p.r*.45,0,TAU);cx.fill()}
  cx.restore();
}
function drawShrimp(s){
  const S=s.s,fl=Math.sin(s.ph*(s.mode==='swim'?11:20))*.22;
  let a=s.ang;if(s.mode==='flip')a+=s.spin/.7*TAU*s.flipDir;
  cx.save();cx.translate(s.x,s.y);cx.rotate(a);if(Math.cos(s.ang)<0)cx.scale(1,-1);
  const col=`hsla(${s.hue},85%,83%,.95)`,dk=`hsla(${s.hue},70%,64%,.95)`;
  cx.lineCap='round';
  cx.strokeStyle=`hsla(${s.hue},70%,88%,.55)`;cx.lineWidth=1;cx.beginPath();
  cx.moveTo(S*.8,-S*.12);cx.quadraticCurveTo(S*2,-S*.9+fl*S,S*2.7,-S*.25);
  cx.moveTo(S*.85,0);cx.quadraticCurveTo(S*2.1,-S*.25,S*2.8,S*.45+fl*S*.6);cx.stroke();
  cx.strokeStyle=dk;cx.lineWidth=1.2;
  for(let i=0;i<4;i++){const x=S*(.62-i*.28);cx.beginPath();cx.moveTo(x,S*.22);cx.lineTo(x-S*.12+Math.sin(s.ph*16+i)*S*.12,S*.62);cx.stroke()}
  // curled abdomen
  let px=-S*.1,py=0,th=Math.PI;cx.fillStyle=col;
  for(let i=0;i<5;i++){th-=.3+fl*.35;px+=Math.cos(th)*S*.34;py+=Math.sin(th)*S*.34;
    const r=S*(.34-i*.035);cx.beginPath();cx.ellipse(px,py,r*1.15,r,th,0,TAU);cx.fill()}
  cx.fillStyle=dk;
  for(const k of[-.5,0,.5]){cx.beginPath();cx.ellipse(px+Math.cos(th+k)*S*.28,py+Math.sin(th+k)*S*.28,S*.24,S*.09,th+k,0,TAU);cx.fill()}
  // head
  cx.fillStyle=col;cx.beginPath();cx.ellipse(S*.35,0,S*.62,S*.36,0,0,TAU);cx.fill();
  cx.beginPath();cx.moveTo(S*.9,-S*.2);cx.lineTo(S*1.35,-S*.32);cx.lineTo(S*.92,-S*.02);cx.fill();
  cx.fillStyle='#2a1018';cx.beginPath();cx.arc(S*.72,-S*.13,S*.09,0,TAU);cx.fill();
  cx.restore();
}

/* ---- クジラ: a whale glides by, breathing bubbles ---- */
function whaleBubble(w,burst){
  const h=w.L*.24,bx=w.x+w.dir*w.L*.2,by=w.y-h*.5,r=burst?14+Math.random()*16:16+Math.random()*20;
  bubbles.push({x:bx+(Math.random()-.5)*w.L*(burst?.1:.5),y:by-(burst?0:Math.random()*20),r,
    sp:(burst?150:70)+Math.random()*60,ph:Math.random()*6.28,wf:.8+Math.random(),wa:burst?30:14,
    hue:180+Math.random()*30,pearl:false,glow:false,born:.2});
}
function stepWhale(dt){
  const w=whale;if(!w)return;
  w.x+=w.dir*w.v*dt;w.bt-=dt;w.cd-=dt;if(w.happy>0)w.happy-=dt;
  if(w.bt<=0&&evt.t<evt.len-2){w.bt=.14+Math.random()*.12;whaleBubble(w,false)}
}
function hitWhale(px,py){
  const w=whale;if(!w)return false;

  if(dx*dx+dy*dy>1)return false;
  if(w.cd<=0){
    w.cd=.9;w.happy=1.2;spray();

    pops.push({x:w.x+w.dir*w.L*.2,y:w.y-h*.9,life:1,txt:'ブシュー'});

}

  cx.restore();

/* ---- 巨大イカの影: a huge squid shadow rises and reaches up with its arms ---- */
let squid=null,inks=[];
function startSquid(){
  const n=W<500?5:7;squid={rise:0,blink:0,eyeT:3,eyes:[],tents:[]};
  for(let i=0;i<n;i++)squid.tents.push({bx:W*(i+.5)/n,ext:0,state:'wait',cd:1.5+i*.4+Math.random(),tx:0,ty:0,
    ph:Math.random()*6,w:Math.max(9,Math.min(W,H)*.026),hold:0,fast:0,pts:[]});
}
function aimTent(t){t.tx=Math.max(30,Math.min(W-30,t.bx+(Math.random()-.5)*W*.5));t.ty=H*(.28+Math.random()*.4);t.state='out';t.hold=0}
function stepSquid(dt){
  const s=squid,e=evt;if(!s)return;
  const fin=e.t>e.len-3;
  s.rise+=((fin?0:1)-s.rise)*Math.min(1,dt*(fin?1.3:.6));
  s.eyeT-=dt;if(s.eyeT<=0){s.blink=.3;s.eyeT=2.5+Math.random()*3}
  if(s.blink>0)s.blink-=dt;
  for(const t of s.tents){t.ph+=dt;
    if(fin&&t.state==='out')t.state='back';
    if(t.state==='wait'){t.cd-=dt;if(t.cd<=0&&!fin)aimTent(t)}
    else if(t.state==='out'){t.ext=Math.min(1,t.ext+dt*.4);if(t.ext>=1){t.hold+=dt;if(t.hold>3.5)t.state='back'}}
    else{t.ext-=dt*(t.fast?3:1);if(t.ext<=0){t.ext=0;t.state='wait';t.fast=0;t.cd=1+Math.random()*2.2}}
  }
}
function tentPts(t,time){
  const bx=t.bx,by=H+40,e=ease(t.ext),tx=bx+(t.tx-bx)*e,ty=by+(t.ty-by)*e;
  const dx=tx-bx,dy=ty-by,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pts=[];
  for(let i=0;i<=16;i++){const f=i/16,wv=Math.sin(f*4-time*2.2+t.ph)*Math.min(60,L*.14)*f;
    pts.push([bx+dx*f+nx*wv,by+dy*f+ny*wv,f])}
  return pts;
}
function drawTents(time){
  if(!squid)return;
  for(const tn of squid.tents){
    if(tn.ext<=0){tn.pts=[];continue}
    const p=tentPts(tn,time),Lf=[],Rt=[];tn.pts=p;
    for(let i=0;i<p.length;i++){
      const a=p[Math.max(0,i-1)],b=p[Math.min(p.length-1,i+1)],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1,f=p[i][2];
      const w=tn.w*(1-f*.6)*(f>.75?1+Math.sin((f-.75)/.25*Math.PI)*.7:1);   // club-shaped tip
      Lf.push([p[i][0]-dy/l*w,p[i][1]+dx/l*w]);Rt.push([p[i][0]+dy/l*w,p[i][1]-dx/l*w]);
    }
    cx.fillStyle='rgba(66,18,40,.95)';cx.beginPath();
    Lf.forEach((q,i)=>i?cx.lineTo(q[0],q[1]):cx.moveTo(q[0],q[1]));
    const tip=p[p.length-1];cx.arc(tip[0],tip[1],tn.w*.42,0,TAU);
    for(let i=Rt.length-1;i>=0;i--)cx.lineTo(Rt[i][0],Rt[i][1]);
    cx.closePath();cx.fill();
    cx.fillStyle='rgba(255,190,205,.32)';
    for(let i=9;i<p.length;i++){const q=Lf[i];cx.beginPath();cx.arc((q[0]+p[i][0])/2,(q[1]+p[i][1])/2,tn.w*.16,0,TAU);cx.fill()}
  }
}
function drawSquidBody(t){
  if(!squid)return;const s=squid,r=ease(s.rise);if(r<=.001)return;
  cx.fillStyle=`rgba(0,2,8,${.55*r})`;cx.fillRect(0,0,W,H);
  const MW=Math.min(W*.6,280),ML=Math.min(H*.42,MW*1.6),x=W/2+Math.sin(t*.4)*W*.03,top=H*1.05-r*H*.7,hy=top+ML;
  cx.save();cx.globalAlpha=.85;
  const g=cx.createLinearGradient(0,top,0,hy+ML*.4);g.addColorStop(0,'#2a0c1c');g.addColorStop(1,'#12040c');
  cx.fillStyle=g;
  cx.beginPath();cx.moveTo(x,top-ML*.05);cx.quadraticCurveTo(x-MW*.75,top+ML*.12,x-MW*.28,top+ML*.38);cx.lineTo(x,top+ML*.2);
  cx.lineTo(x+MW*.28,top+ML*.38);cx.quadraticCurveTo(x+MW*.75,top+ML*.12,x,top-ML*.05);cx.fill();
  cx.beginPath();cx.moveTo(x,top);cx.bezierCurveTo(x+MW*.42,top+ML*.25,x+MW*.36,hy-ML*.15,x+MW*.3,hy);
  cx.lineTo(x-MW*.3,hy);cx.bezierCurveTo(x-MW*.36,hy-ML*.15,x-MW*.42,top+ML*.25,x,top);cx.fill();
  cx.beginPath();cx.ellipse(x,hy+MW*.12,MW*.36,MW*.22,0,0,TAU);cx.fill();
  cx.strokeStyle='#14050d';cx.lineCap='round';
  for(let i=0;i<8;i++){const ax=x+(i-3.5)*MW*.085;cx.lineWidth=MW*.07*(1-Math.abs(i-3.5)*.08);cx.beginPath();cx.moveTo(ax,hy+MW*.2);
    cx.quadraticCurveTo(ax+Math.sin(t*1.5+i)*MW*.15,hy+MW*.6,ax+(i-3.5)*MW*.05+Math.sin(t*1.2+i*.7)*MW*.2,H+60);cx.stroke()}
  cx.restore();
  s.eyes=[];
  const op=s.blink>0?Math.max(.08,Math.abs(2*s.blink/.3-1)):1;
  for(const sx of[-1,1]){const ex=x+sx*MW*.27,ey=hy+MW*.1,er=MW*.085;s.eyes.push([ex,ey,er]);
    cx.save();cx.globalAlpha=r;cx.translate(ex,ey);cx.scale(1,op);
    cx.shadowColor='#ffc86a';cx.shadowBlur=24;
    const eg=cx.createRadialGradient(0,0,0,0,0,er);eg.addColorStop(0,'#fff0b0');eg.addColorStop(1,'#e8a040');
    cx.fillStyle=eg;cx.beginPath();cx.arc(0,0,er,0,TAU);cx.fill();cx.shadowBlur=0;
    cx.fillStyle='#1a0610';cx.beginPath();cx.ellipse(0,0,er*.62,er*.28,0,0,TAU);cx.fill();
    cx.fillStyle='rgba(255,255,255,.7)';cx.beginPath();cx.arc(-er*.35,-er*.4,er*.15,0,TAU);cx.fill();
    cx.restore()}
}
function hitSquid(px,py){
  if(!squid||!evt||evt.kind!=='squid')return false;
  for(const tn of squid.tents){
    if(tn.state!=='out'||tn.ext<.2||!tn.pts.length)continue;
    for(let i=tn.pts.length-1;i>=6;i--){const p=tn.pts[i],dx=px-p[0],dy=py-p[1],r=tn.w*1.3+16;
      if(dx*dx+dy*dy<=r*r){
        tn.state='back';tn.fast=1;score+=2;evt.n++;$('evn').textContent=evt.n;
        const tip=tn.pts[tn.pts.length-1];inkPuff(tip[0],tip[1]);
        pops.push({x:px,y:py-24,life:.9,txt:'するっ',col:'#ffd0dc'});update();return true}}
  }
  for(const [ex,ey,er] of squid.eyes){const dx=px-ex,dy=py-ey;
    if(dx*dx+dy*dy<=(er+14)**2){squid.blink=.3;pops.push({x:ex,y:ey-er-16,life:.8,txt:'ぱちっ',col:'#ffe0a0'});return true}}
  return false;
}
function inkPuff(x,y){inkSnd();for(let i=0;i<16;i++){const a=Math.random()*TAU,v=20+Math.random()*90;
  inks.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:8+Math.random()*10,life:1})}}
function stepInk(dt){for(let i=inks.length-1;i>=0;i--){const p=inks[i];p.life-=dt*.45;p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vx*=.95;p.vy*=.95;p.r+=dt*20;if(p.life<=0)inks.splice(i,1)}}
function drawInk(){for(const p of inks){const a=Math.max(0,p.life);
  cx.fillStyle=`rgba(30,14,48,${.45*a})`;cx.strokeStyle=`rgba(150,120,210,${.18*a})`;cx.lineWidth=1;
  cx.beginPath();cx.arc(p.x,p.y,p.r,0,TAU);cx.fill();cx.stroke()}}

/* ---- 海底の宝箱: a chest sinks to the sand; knock to open, treasure floats out ---- */
let chest=null,loot=[],takara=0;
try{takara=+localStorage.getItem('awa-takara')||0}catch(e){}
const NEED=5,LV={coin:2,pearl:3,gem:5};
function chestGeo(){const w=Math.min(W*.42,190);return{x:W/2,w,h:w*.62,g:H*.86}}
function startTreasure(){chest={y:-60,vy:0,landed:false,hits:0,open:0,opened:false,shake:0,cd:0,auto:1.5}}
function sandPuff(x,y){for(let i=0;i<16;i++){const a=Math.PI+Math.random()*Math.PI,v=40+Math.random()*110;
  bits.push({x:x+(Math.random()-.5)*80,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.6,r:1.5+Math.random()*2.5,life:1,col:'#cbb894'})}}
function stepTreasure(dt){
  const c=chest;if(!c)return;const G=chestGeo(),e=evt;
  if(!c.landed){c.vy+=900*dt;c.y+=c.vy*dt;
    if(c.y>=G.g){c.y=G.g;if(c.vy>120){c.vy=-c.vy*.3;knock();sandPuff(G.x,G.g)}else{c.vy=0;c.landed=true}}}
  if(c.shake>0)c.shake-=dt;c.cd-=dt;
  c.open+=((c.opened&&e.t<e.len-2?1:0)-c.open)*Math.min(1,dt*5);
  if(c.opened&&e.t<e.len-3){c.auto-=dt;if(c.auto<=0){c.auto=1.4+Math.random();burstLoot(3)}}
}
function burstLoot(n){
  const G=chestGeo(),c=chest;if(!c)return;
  for(let i=0;i<n;i++){const k=Math.random(),type=k<.58?'coin':k<.86?'pearl':'gem';
    loot.push({x:G.x+(Math.random()-.5)*G.w*.4,y:c.y-G.h*.7,vx:(Math.random()-.5)*320,vy:-(220+Math.random()*260),type,
      r:type==='gem'?15:type==='pearl'?12:14,ph:Math.random()*6,hue:Math.random()*360})}
  for(let i=0;i<10;i++){const a=-Math.PI*Math.random(),v=60+Math.random()*120;
    bits.push({x:G.x,y:c.y-G.h*.65,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1+Math.random()*2,life:1,col:'#ffe6a8'})}
}
function stepLoot(dt){for(let i=loot.length-1;i>=0;i--){const l=loot[i];l.ph+=dt;
  l.vy+=(-45-l.vy)*Math.min(1,dt*1.4);l.vx*=1-Math.min(1,dt*1.2);
  l.x+=l.vx*dt+Math.sin(l.ph*1.5)*14*dt;l.y+=l.vy*dt;if(l.y<-40)loot.splice(i,1)}}
function hitLoot(px,py){
  for(let i=loot.length-1;i>=0;i--){const l=loot[i],dx=px-l.x,dy=py-l.y;
    if(dx*dx+dy*dy<=(l.r+16)**2){
      loot.splice(i,1);const v=LV[l.type];score+=v;
      if(evt&&evt.kind==='treasure'){evt.n++;$('evn').textContent=evt.n}
      takara++;try{localStorage.setItem('awa-takara',takara)}catch(e){}
      const col=l.type==='coin'?'#ffd76a':l.type==='pearl'?'#fff6ea':`hsl(${l.hue},90%,72%)`;
      for(let k=0;k<12;k++){const a=Math.random()*TAU,s=40+Math.random()*100;
        bits.push({x:l.x,y:l.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*2.2,life:1,col})}
      pops.push({x:l.x,y:l.y-20,life:.9,txt:'+'+v,col});ping(l.type);update();return true}}
  return false;
}
function hitChest(px,py){
  const c=chest;if(!c||!c.landed||!evt||evt.kind!=='treasure')return false;const G=chestGeo();
  if(Math.abs(px-G.x)>G.w/2+14||py<c.y-G.h*1.25||py>c.y+14)return false;
  if(!c.opened){c.hits++;c.shake=.3;knock();
    if(c.hits>=NEED){c.opened=true;shimmer();burstLoot(18);pops.push({x:G.x,y:c.y-G.h*1.4,life:1.1,txt:'パカッ',col:'#ffe6a8'})}
    else pops.push({x:G.x,y:c.y-G.h*1.3,life:.8,txt:'あと '+(NEED-c.hits),col:'#ffe6a8'})}
  else if(c.cd<=0){c.cd=.7;burstLoot(4)}
  return true;
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function drawTreasure(t){
  const c=chest,e=evt;if(!c||!e||e.kind!=='treasure')return;
  const G=chestGeo(),a=Math.max(0,Math.min(1,e.t,(e.len-e.t)/1.5));if(a<=0)return;
  cx.save();cx.globalAlpha=a;
  const sg=cx.createLinearGradient(0,G.g-30,0,H);sg.addColorStop(0,'#6b6050');sg.addColorStop(1,'#26221c');
  cx.fillStyle=sg;cx.beginPath();cx.moveTo(0,H);
  for(let x=0;x<=W+10;x+=10)cx.lineTo(x,G.g+8-Math.sin(x/W*Math.PI)*28+Math.sin(x*.03)*3);
  cx.lineTo(W,H);cx.closePath();cx.fill();
  const x=G.x+(c.shake>0?Math.sin(t*70)*c.shake*14:0),y=c.y,w=G.w,h=G.h,bh=h*.6,top=y-bh;
  if(c.open>.02){

    cx.fillStyle=gg;cx.beginPath();cx.arc(x,top,w*1.4,0,TAU);cx.fill();

  const bg=cx.createLinearGradient(0,top,0,y);bg.addColorStop(0,'#8a5428');bg.addColorStop(1,'#4a2810');
  cx.fillStyle=bg;rr(x-w/2,top,w,bh,6);cx.fill();
  cx.strokeStyle='rgba(30,14,4,.5)';cx.lineWidth=1;
  for(let k=1;k<3;k++){cx.beginPath();cx.moveTo(x-w/2,top+bh*k/3);cx.lineTo(x+w/2,top+bh*k/3);cx.stroke()}
  cx.fillStyle='#e0b04a';cx.fillRect(x-w*.36,top,w*.07,bh);cx.fillRect(x+w*.29,top,w*.07,bh);cx.fillRect(x-w/2,top,w,h*.05);
  if(c.open>.02){
    cx.fillStyle='#2a1606';cx.beginPath();cx.ellipse(x,top+2,w*.47,h*.07,0,0,TAU);cx.fill();
    cx.fillStyle='#ffd76a';for(let k=0;k<7;k++){cx.beginPath();cx.arc(x-w*.33+k*w*.11,top-2-Math.sin(k*1.7)*3,w*.045,0,TAU);cx.fill()}
  }
  const lh=h*.4;cx.save();cx.translate(x-w/2,top);cx.rotate(-c.open*1.25);
  cx.beginPath();cx.moveTo(0,0);cx.lineTo(0,-lh*.5);cx.quadraticCurveTo(w/2,-lh*1.3,w,-lh*.5);cx.lineTo(w,0);cx.closePath();
  const lg=cx.createLinearGradient(0,-lh,0,0);lg.addColorStop(0,'#a0662f');lg.addColorStop(1,'#6a3a16');
  cx.fillStyle=lg;cx.fill();cx.save();cx.clip();
  cx.fillStyle='#e0b04a';cx.fillRect(w*.14,-lh,w*.07,lh);cx.fillRect(w*.79,-lh,w*.07,lh);cx.restore();
  cx.restore();
  if(!c.opened){cx.fillStyle='#f0c860';rr(x-w*.07,top-h*.04,w*.14,h*.2,3);cx.fill();
    cx.fillStyle='#3a2208';cx.beginPath();cx.arc(x,top+h*.05,w*.018,0,TAU);cx.fill()}
  cx.restore();
}
function drawLoot(){for(const l of loot){cx.save();cx.translate(l.x,l.y);
  if(l.type==='coin'){cx.scale(Math.abs(Math.cos(l.ph*3))*.8+.2,1);cx.shadowColor='#ffd76a';cx.shadowBlur=12;
    const g=cx.createRadialGradient(-l.r*.3,-l.r*.3,1,0,0,l.r);g.addColorStop(0,'#fff2b0');g.addColorStop(1,'#d9a520');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,l.r,0,TAU);cx.fill();
    cx.shadowBlur=0;cx.strokeStyle='rgba(150,100,10,.7)';cx.lineWidth=1.5;cx.beginPath();cx.arc(0,0,l.r*.66,0,TAU);cx.stroke()}
  else if(l.type==='pearl'){cx.shadowColor='#fff';cx.shadowBlur=14;
    const g=cx.createRadialGradient(-l.r*.35,-l.r*.35,1,0,0,l.r);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#d8d0e8');
    cx.fillStyle=g;cx.beginPath();cx.arc(0,0,l.r,0,TAU);cx.fill()}
  else{const r=l.r;cx.rotate(Math.sin(l.ph*2)*.3);cx.shadowColor=`hsl(${l.hue},100%,70%)`;cx.shadowBlur=18;
    cx.fillStyle=`hsl(${l.hue},85%,62%)`;cx.beginPath();cx.moveTo(0,-r);cx.lineTo(r*.8,-r*.25);cx.lineTo(0,r);cx.lineTo(-r*.8,-r*.25);cx.closePath();cx.fill();
    cx.shadowBlur=0;cx.fillStyle=`hsla(${l.hue},90%,88%,.8)`;cx.beginPath();cx.moveTo(0,-r);cx.lineTo(r*.8,-r*.25);cx.lineTo(0,-r*.1);cx.lineTo(-r*.8,-r*.25);cx.closePath();cx.fill()}
  cx.restore()}}
function knock(){noise(.15,'lowpass',600,.5)}
function inkSnd(){noise(.45,'lowpass',380,.3)}
function ping(type){
  if(!soundOn||!actx)return;
  const n=actx.currentTime,o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value={coin:1318.5,pearl:1568,gem:2093}[type];
  g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.12,n+.005);g.gain.exponentialRampToValueAtTime(.0001,n+.4);
  o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.45);
}

/* ---- tapping ---- */
let lastLevel=0,hintGone=false;
function hit(px,py){
  if(paused)return;
  if(evt&&evt.kind==='glow')plankRing(px,py);
  if(hitCreature(px,py))return;
  if(hitShrimp(px,py))return;
  if(hitSquid(px,py))return;
  if(hitLoot(px,py))return;
  if(hitChest(px,py))return;
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i],dx=px-b.x,dy=py-b.y;
    if(dx*dx+dy*dy<=(b.r+10)**2){
      burst(b);bubbles.splice(i,1);pop(b.pearl||b.glow);
      score+=b.pearl?5:b.glow?2:1;
      if(evt&&(evt.kind==='whale'||(evt.kind==='glow'&&b.glow))){evt.n++;$('evn').textContent=evt.n}
      update();
      if(!hintGone){hintGone=true;$('hint').style.opacity=0}
      return;
    }
  }
  if(hitChimney(px,py))return;
  if(hitWhale(px,py))return;
}
cv.addEventListener('pointerdown',e=>hit(e.clientX,e.clientY));

function burst(b){
  const n=b.pearl||b.glow?22:12,col=b.glow?`hsl(${b.hue},100%,78%)`:null;
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;
    bits.push({x:b.x,y:b.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1+Math.random()*(b.r/9),life:1,pearl:b.pearl,col})}
  bits.push({ring:1,x:b.x,y:b.y,r:b.r,life:1,pearl:b.pearl,col});
}

function update(){
  $('score').textContent=score;
  const L=level();
  $('depth').textContent=2+L*8;
  $('bar').style.width=((score%PER)/PER*100)+'%';
  if(score>best){best=score;try{localStorage.setItem('awa-best',best)}catch(e){}}
  $('best').textContent='きろく '+best;
  let leveled=false;
  if(L>lastLevel){lastLevel=L;leveled=true;
    if(!evt)showToast('<b>水深 '+(2+L*8)+' m</b>'+(depthNames[Math.min(L,depthNames.length-1)])+'へ。泡が少し速くなります',2600)}
  if(!evt&&!pendingEvt&&score>=nextAt){pendingEvt={kind:SEQ[seqI%SEQ.length],wait:leveled?2.6:.4};seqI++}
  $('nx').textContent=evt||pendingEvt?'できごとの最中':NAMES[SEQ[seqI%SEQ.length]]+'まで あと '+Math.max(0,nextAt-score);
}
let toastTimer;
function showToast(html,ms){
  const el=$('toast');clearTimeout(toastTimer);
  if(!html){el.classList.remove('show');return}
  el.innerHTML=html;el.classList.add('show');
  toastTimer=setTimeout(()=>el.classList.remove('show'),ms);
}

/* ---- drawing ---- */
function water(){
  const L=Math.min(level(),8),k=L/8;
  // deeper = darker
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,`hsl(${192-k*12} ${62-k*20}% ${34-k*22}%)`);
  g.addColorStop(.55,`hsl(${200-k*10} ${70-k*25}% ${18-k*11}%)`);
  g.addColorStop(1,`hsl(${210} ${70-k*30}% ${8-k*4}%)`);
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // light rays from the surface
  const t=performance.now()/1000;
  cx.save();cx.globalCompositeOperation='lighter';
  for(let i=0;i<4;i++){
    const x=W*(.15+i*.25)+Math.sin(t*.2+i*1.7)*W*.06;
    const rg=cx.createLinearGradient(0,0,0,H*.85);
    rg.addColorStop(0,`rgba(190,240,240,${.07*(1-k*.8)})`);rg.addColorStop(1,'rgba(190,240,240,0)');
    cx.fillStyle=rg;cx.beginPath();cx.moveTo(x-30,0);cx.lineTo(x+40,0);cx.lineTo(x+140,H*.85);cx.lineTo(x-90,H*.85);cx.fill();
  }
  cx.restore();
  // drifting specks
  cx.fillStyle='rgba(220,250,250,.25)';
  for(const m of motes){cx.beginPath();cx.arc(m.x*W,m.y*H,m.s,0,6.28);cx.fill()}
}
function drawBubble(b){
  const s=Math.min(1,b.born);const r=b.r*(.6+.4*s);
  cx.save();cx.globalAlpha=s;
  const g=cx.createRadialGradient(b.x-r*.3,b.y-r*.35,r*.1,b.x,b.y,r);
  if(b.pearl){
    g.addColorStop(0,'rgba(255,248,220,.85)');g.addColorStop(.6,'rgba(255,214,140,.28)');g.addColorStop(1,'rgba(255,230,168,.55)');
  }else if(b.glow){
    g.addColorStop(0,`hsla(${b.hue},100%,90%,.35)`);g.addColorStop(.7,`hsla(${b.hue},100%,70%,.15)`);g.addColorStop(1,`hsla(${b.hue},100%,75%,.7)`);
    cx.shadowColor=`hsl(${b.hue},100%,70%)`;cx.shadowBlur=18;
  }else{
    g.addColorStop(0,'rgba(255,255,255,.06)');g.addColorStop(.75,`hsla(${b.hue},80%,80%,.08)`);g.addColorStop(1,`hsla(${b.hue},90%,88%,.42)`);
  }
  cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,r,0,6.28);cx.fill();
  cx.lineWidth=b.glow?1.8:1.2;cx.strokeStyle=b.pearl?'rgba(255,230,168,.8)':b.glow?`hsla(${b.hue},100%,82%,.95)`:`hsla(${b.hue},90%,92%,.55)`;cx.stroke();
  cx.shadowBlur=0;
  // highlights
  cx.fillStyle='rgba(255,255,255,.75)';
  cx.beginPath();cx.ellipse(b.x-r*.38,b.y-r*.42,r*.2,r*.11,-.7,0,6.28);cx.fill();
  cx.fillStyle='rgba(255,255,255,.35)';
  cx.beginPath();cx.arc(b.x+r*.42,b.y+r*.38,r*.06,0,6.28);cx.fill();
  cx.restore();
}

function frame(now){
  let dt=Math.min(.05,(now-t0)/1000);t0=now;
  if(paused)dt=0;
  if(reduce)dt*=.6;
  const c=cfg(),t=now/1000;
  stepEvent(dt);
  spawnT-=dt;
  if(spawnT<=0&&!paused&&(!evt||evt.kind==='glow'||evt.kind==='squid')){spawn();spawnT=c.spawn*(!evt?1:evt.kind==='glow'?.45:1.4)*(.6+Math.random()*.8)}
  for(const m of motes){m.y-=m.v*dt;if(m.y<0)m.y+=1}
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];b.born=Math.min(1,b.born+dt*2.5);
    b.y-=b.sp*dt;b.ph+=b.wf*dt;b.x+=Math.cos(b.ph)*b.wa*dt;
    if(b.y<-b.r-10)bubbles.splice(i,1);   // escaped quietly; no penalty
  }
  for(let i=bits.length-1;i>=0;i--){
    const p=bits[i];p.life-=dt*(p.ring?3:1.8);
    if(!p.ring){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy=p.vy*.94-30*dt}
    if(p.life<=0)bits.splice(i,1);
  }
  stepShrimps(dt);stepPlume(dt);stepPlank(dt);stepInk(dt);stepLoot(dt);
  water();
  drawVent(t);drawPlume();
  drawSquidBody(t);
  drawWhale(t);
  stepCreature(dt);drawCreature(t);
  drawGlow();
  drawTreasure(t);drawTents(t);
  for(const b of bubbles)drawBubble(b);
  for(const s of shrimps)drawShrimp(s);
  drawLoot();drawInk();
  for(const p of bits){
    cx.globalAlpha=Math.max(0,Math.min(1,p.life));
    const col=p.col||(p.pearl?'#ffe6a8':p.ring?'#dffcfa':'#e8fbfa');
    if(p.ring){cx.strokeStyle=col;cx.lineWidth=2*p.life;
      cx.beginPath();cx.arc(p.x,p.y,p.r*(1+(1-p.life)*.8),0,6.28);cx.stroke()}
    else{cx.fillStyle=col;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.28);cx.fill()}
  }
  cx.globalAlpha=1;
  drawPops(dt);
  requestAnimationFrame(frame);
}
update();
requestAnimationFrame(frame);
})();
</script>
